<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>词根宇宙 · TOEFL Lab</title>
<link rel="stylesheet" href="style.css?v=20261111ux1"><script src="alliance-ui.js?v=20261111ux1" defer></script><script src="app.js?v=20261111ux1" defer></script>
</head>
<body>
<aside class="sidebar"><div class="brand"><img src="brand.png" alt=""><b>TOEFL <span>Lab</span></b></div><div class="side-section">词根宇宙</div><nav aria-label="功能"><button class="navbtn on" data-view="lookup"><span class="navnum">01</span>查一个词</button><button class="navbtn" data-view="graph"><span class="navnum">02</span>探索词族</button><button class="navbtn" data-view="practice"><span class="navnum">03</span>串联练习</button></nav><div class="side-footer">把零散的词，连成记得住的关系。<a href="/#/home" data-desk-link target="_blank" rel="noopener">返回研读桌 ↗</a></div></aside>
<div class="mobile-brand"><div class="brand"><img src="brand.png" alt=""><b>TOEFL <span>Lab</span></b></div><a class="mobile-desk-link" href="/#/home" data-desk-link target="_blank" rel="noopener">返回研读桌 ↗</a></div>
<main class="main"><div class="topline"><span class="context">学习空间 <span aria-hidden="true">/</span> <strong>词根词典</strong></span><span class="context" id="top-context">从一个词，认识一个词族</span></div><nav class="mobile-tabs" aria-label="功能"><button class="on" data-view="lookup">查一个词</button><button data-view="graph">探索词族</button><button data-view="practice">串联练习</button></nav>
<section class="view" id="lookup-view"><div class="pagehead"><div><h1>查一个词</h1><p>看懂它怎么构成，也看看它和谁有关。</p></div></div><div class="search-area"><form class="searchbox" id="search-form" role="search"><span class="searchmark" aria-hidden="true">⌕</span><input id="search" aria-label="搜索单词、词根或含义" placeholder="输入单词、词根或含义" autocomplete="off" spellcheck="false" maxlength="120"><button class="primary" type="submit">查词</button></form><div class="suggestions" id="suggestions" hidden></div></div><button class="link root-word-return" id="lookup-root-return" hidden></button><div id="word-content" aria-live="polite"></div></section>
<section class="view" id="graph-view" hidden>
  <div class="pagehead"><div><button class="link explorer-back" id="explorer-back" hidden>← 词根目录</button><h1 id="explorer-title">探索词族</h1><p id="explorer-subtitle">从词根出发，找到相关单词。</p></div></div>
  <section id="root-directory-panel" aria-label="词根目录">
    <form class="searchbox" id="root-search-form" role="search"><input id="root-search" aria-label="搜索词根或含义" placeholder="搜索词根或含义，如 dict、生命" autocomplete="off" spellcheck="false" maxlength="120"><button class="primary" type="submit">搜索</button></form>
    <div class="root-course-filter" id="root-course-filter" aria-label="按课程筛选"></div>
    <p class="root-coverage" id="root-coverage" role="status">正在读取词根目录…</p>
    <div class="root-directory" id="root-directory" aria-live="polite"></div>
  </section>
  <section id="root-detail-panel" hidden aria-label="相关单词"><div class="root-detail-actions"><span id="root-member-count"></span><button class="secondary" id="show-root-map">查看关系图 →</button></div><div id="root-members" aria-live="polite"></div></section>
  <section id="root-map-panel" hidden aria-label="词族关系图"><p id="map-loading" class="empty-search" role="status" hidden></p><details class="family-directory"><summary>切换课程图谱</summary><div class="graph-family-switch" id="family-switch"></div></details><div class="graph-grid"><div><div class="graph-legend"><span><i class="legend-line"></i>现代构词</span><span><i class="legend-line history"></i>历史溯源</span></div><div class="graph-toolbar"><button class="back-btn" id="graph-back" disabled>← 返回上一个词</button><span class="label">当前词附近 · 两层关系</span></div><div class="family-map" id="family-map" aria-label="可点击的词族关系图"><svg id="map-lines" aria-hidden="true"></svg><div id="map-nodes"></div></div><p class="graph-note">点一个词，以它为中心继续展开。每条关系都可回看出处。</p></div><aside class="graph-detail" id="graph-detail" aria-live="polite"></aside></div></section>
</section>
<section class="view" id="practice-view" hidden><div class="pagehead"><div><h1>串联练习</h1><p>共同的来由，不同的用法。把相近的词分清楚。</p></div><span class="tag green" id="practice-family-tag"></span></div><div class="practice-layout"><div class="practice-card" id="practice-card" aria-live="polite"></div><aside class="practice-aside" id="practice-aside"></aside></div></section>
<footer class="bottom-source">词源依据：<a href="https://en.wiktionary.org/" target="_blank" rel="noopener">Wiktionary</a> · 内容依 <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> 整理，中文为译文。仅收录已通过独立来源复核的词族。</footer>
</main>
<div class="toast" id="toast" hidden></div>
</body></html>
