<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风格对比</title><style>
:root{--canvas:#f4f4f4;--surface:#fff;--well:#e8e8e8;--raised:#fff;--line:#e2e2e2;--line-2:#d0d0d0;--text:#161616;--soft:#5c5c5c;--faint:#8c8c8c;--ink:#161616;--hl:#ffe28a;--bar-h:48px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--brand:"Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--canvas);font-synthesis:none;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
 /* 动效：咔嗒用于控件，滑行用于画面与切换，弹出用于确认；弹簧曲线由刚度/阻尼采样 */

*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--canvas)}h1,h2,p,dl,dd{margin:0}button,textarea,input{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}:focus-visible{outline:2px solid var(--ink);outline-offset:3px}[hidden]{display:none!important}

.card{min-width:0;display:flex;flex-direction:column}

.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

.is-chosen .pick-mark{display:inline-flex}.is-chosen .frame{box-shadow:0 0 0 2px var(--ink),0 30px 60px -30px #00000052}.is-chosen .cap .no{color:var(--text)}

.pick{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;line-height:1.5;padding:8px 16px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s,transform .35s var(--snap)}.pick:hover{background:#0000000a}.pick:active{transform:scale(.96);transition-duration:.2s,.2s,.2s,.08s}

.pick[data-on]{background:var(--ink);color:#fff;box-shadow:none}.pick[data-on]:hover{background:#333}.pick[data-on] kbd{color:#bdbdbd;box-shadow:inset 0 0 0 1px #ffffff40}

.cap .pick{flex:none;font-size:13px;padding:4px 12px;border-radius:6px}

.surface{position:relative;flex:1;min-height:0;overflow:hidden}
.track{display:flex;height:100%;transition:transform var(--glide-d) var(--glide)}

.slide .stage{flex:none;box-shadow:0 0 0 1px #00000014,0 40px 80px -40px #00000059;transition:transform var(--glide-d) var(--glide),opacity var(--glide-d) ease-out}.slide:not(.is-current) .stage{transform:scale(.92);opacity:.4}.slide.is-current .stage iframe{pointer-events:auto}
.nav{position:absolute;top:50%;z-index:2;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#ffffffd9;color:var(--ink);box-shadow:0 0 0 1px #00000014,0 8px 24px -6px #00000033;backdrop-filter:blur(8px);opacity:.85;transition:opacity .2s,transform .35s var(--snap)}.nav:hover{opacity:1}.nav:active{transform:scale(.9);transition-duration:.2s,.08s}.nav.prev{left:14px}.nav.next{right:14px}.nav:disabled{opacity:0;pointer-events:none;transform:scale(.8)}

.film button{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3px 10px;padding:7px 10px;border-radius:8px;color:var(--soft);text-align:left;transition:color .2s,background .15s}.film button:hover{color:var(--text)}.film button:not([aria-current=true]):hover{background:#00000006}.film button[aria-current=true]{color:var(--text)}
.film .fn{font-family:var(--mono);font-size:12.5px;color:var(--faint);grid-row:span 2}.film .ft{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.film .strip-mini{margin:0;width:48px;height:3px}
.film .ft.chosen::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block;margin-left:8px;vertical-align:middle}
.info-body{padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px}
.idx{font-size:48px;line-height:.9;font-weight:200;letter-spacing:-.02em;color:var(--faint)}.info .name{font-size:20px;line-height:1.35;margin-top:-6px}.north{font-size:14px;line-height:1.7;color:#2b2b2b}
.big-sw{display:grid;gap:6px}.big-sw div{display:grid;grid-template-columns:32px 1fr;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--soft)}.big-sw i{height:20px;border-radius:4px;box-shadow:inset 0 0 0 1px #00000017}
.info .pick{align-self:stretch;padding:8px 14px;font-size:13.5px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tool{font-size:13px;padding:5px 12px;border-radius:6px;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line-2);transition:color .15s,background .2s}.tool:hover{color:var(--text)}.tool[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.hint{font-size:12px;line-height:1.9;color:var(--faint)}.hint kbd{font-family:var(--mono);font-size:12px;padding:0 5px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--soft)}
.src{font-size:12px;line-height:1.6;color:var(--faint);overflow-wrap:anywhere}

.picked .strip-mini,.choice-empty{flex:none;margin:0;width:22px;height:12px;border-radius:3px}.choice-empty{box-shadow:inset 0 0 0 1px var(--line-2)}

.state{font-size:12px;line-height:1.6;color:var(--faint);padding:8px 2px 0}.state:empty{display:none}.state[data-warn]{color:#b3401f}

.toast{position:fixed;left:50%;bottom:24px;z-index:40;display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));padding:10px 16px 10px 12px;border-radius:12px;background:var(--ink);color:#fff;box-shadow:0 18px 44px -10px #00000066;font-size:13.5px;line-height:1.5;opacity:0;transform:translate(-50%,14px) scale(.96);pointer-events:none;transition:opacity .16s var(--exit),transform .2s var(--exit)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;transition:opacity .18s ease-out,transform var(--snap-d) var(--snap)}
.toast .tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--hl);display:grid;place-items:center}.toast .tick::before{content:"";width:8px;height:4px;margin-top:-2px;border-left:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(-45deg)}.toast[data-fail] .tick{background:#c2462e}.toast[data-fail] .tick::before{width:2px;height:9px;margin:0;border:0;background:#fff;transform:none}
.toast b{font-weight:600;white-space:nowrap}.toast code{font-family:var(--mono);font-size:12.5px;color:#a8a8a8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}.toast[data-fail] code{white-space:pre-wrap}

.none,.empty{max-width:560px;margin:18vh auto;padding:24px;text-align:center;font-size:15px;line-height:1.8;color:var(--soft)}.none button{margin-top:12px;color:var(--text);text-decoration:underline;text-underline-offset:4px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop-in{from{opacity:0;transform:translateY(-4px) scale(.96)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}
@keyframes vt-in{from{opacity:0;transform:scale(.98)}}
@keyframes info-in{from{transform:translateX(100%)}}
@keyframes info-out{to{transform:translateX(100%)}}
/* 并排与单张之间、视口与筛选变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口、筛选、说明开关和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

@media(max-width:1180px){.grid{--cols:2!important}.bar{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}.bar-r{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}.loupe{grid-template-columns:minmax(0,1fr) 280px}}
@media(max-width:760px){.bar{grid-template-columns:1fr;padding:10px 16px}.bar-c{flex-wrap:wrap}.intro{padding:24px 16px 0}.grid{--cols:1!important;padding:24px 16px 48px;gap:48px}.loupe{position:static;display:flex;flex-direction:column}.surface{flex:none}.track{height:auto;align-items:flex-start}.slide{height:auto;padding:16px 12px}.info{border-left:0;border-top:1px solid var(--line)}.film{display:flex;overflow-x:auto}.film button{flex:none}.info-body{padding:20px 16px}.nav{display:none}.picked{border-left:0;padding-left:0}.notes-panel{width:min(340px,calc(100vw - 32px))}.filter-list{right:auto;left:0;transform-origin:top left}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;animation-delay:0s!important}.frame:hover{transform:none}}

-weight:bold}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{color:var(--muted);background:none;padding:9px 15px;border-radius:30px;font-size:14px}nav button.on{color:var(--bg);background:var(--ink)}main{max-width:1360px;margin:auto;padding:0 48px}.screen[hidden],.stage[hidden],.feedback[hidden]{display:none!important}.kicker{font:12px/1.6 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.tag{border:1px solid var(--line);padding:5px 9px;font-size:12px;display:inline-block}.primary,.secondary{padding:14px 21px;font-size:15px;line-height:1.4}.primary{background:var(--accent);color:var(--buttonInk)}.secondary{border:1px solid var(--line);color:var(--ink);background:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}.link{background:none;color:var(--accent);padding:0;font-size:14px;text-decoration:underline;text-underline-offset:5px;margin-top:18px}.flex{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.panel{padding:25px;border:1px solid var(--line);background:var(--surface)}.panel p{font-size:14px;margin-top:12px}.route{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);margin:30px 0}.stop{padding:22px 9px 20px 0;border-bottom:1px solid var(--line)}.stop span{font:14px var(--number)}.stop b{display:block;margin:12px 0 6px;font-size:16px}.stop small{display:block;font-size:12px;line-height:1.7;color:var(--muted)}.stop.current{border-top:3px solid var(--accent);margin-top:-2px;color:var(--accent)}.page-head{padding:40px 0 28px}.page-head h1{font-size:44px;margin:14px 0 16px}.page-head p{color:var(--muted);max-width:800px}.section{padding:36px 0}.footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:25px 0 35px;line-height:1.8;margin-top:30px}.skill{display:grid;grid-template-columns:45px 1fr;gap:15px;padding:20px 0;border-bottom:1px solid var(--line)}.skill>strong{font-size:24px;font-family:var(--title)}.skill p{font-size:14px;color:var(--muted);margin-top:7px}.skill small{display:block;color:var(--accent);margin-top:9px}.node-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.node{background:var(--surface);color:var(--ink);border:1px solid var(--line);text-align:left;padding:24px}.node b{display:block;margin:12px 0;font-size:19px}.node small{color:var(--muted);line-height:1.8}.stage-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px}.stage-buttons button{padding:10px 16px;color:var(--muted);border:1px solid var(--line);background:none}.stage-buttons button.on{background:var(--ink);color:var(--bg)}.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:36px}.lesson{padding:32px;border:1px solid var(--line);background:var(--surface)}.english{font:29px/1.75 var(--english);margin:22px 0}mark{background:var(--highlight);color:var(--ink)}.options{display:grid;gap:10px;margin:22px 0}.options label{display:flex;gap:12px;padding:16px;border:1px solid var(--line);font-size:14px;line-height:1.7}.feedback{padding:20px;background:var(--highlight);font-size:15px;line-height:1.8;margin-top:18px}.aside p{font-size:14px;color:var(--muted);margin:15px 0 25px}.aside h3{margin-top:20px}.stage>p{margin-top:20px}.stage textarea{width:100%;min-height:135px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:18px;margin-top:20px;resize:vertical;font-size:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border:1px solid var(--line);background:none;color:var(--ink);padding:9px 11px;font-size:13px}.tabs button.on{background:var(--ink);color:var(--bg)}.proof-item{border-left:2px solid var(--line);padding-left:19px;margin-top:24px;font-size:14px}.proof-item p{color:var(--muted);margin-top:6px}.work{padding:28px;border:1px solid var(--line)}.work blockquote{font:25px/1.7 var(--english);margin:20px 0}.work p{font-size:14px;color:var(--muted)}.work.new{background:var(--highlight)}@media(max-width:700px){header{padding:20px 22px;flex-wrap:wrap;gap:17px}header nav{width:100%}nav button{padding:9px 11px;font-size:13px}header>.muted{display:none}main{padding:0 22px}.grid,.three,.lesson-grid,.node-grid{grid-template-columns:1fr}.route{grid-template-columns:repeat(3,1fr)}.stop{padding:17px 6px 17px 0}.stop b{font-size:14px}.stop small{font-size:11px}.flex{flex-direction:column;gap:12px}.page-head h1{font-size:34px}.lesson{padding:22px}.english{font-size:24px}.aside{border-top:1px solid var(--line);padding-top:20px}.section{padding:28px 0}.panel{padding:22px}.primary,.secondary{padding:13px 17px}.stage-buttons button{padding:8px 10px;font-size:13px}h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}\n:root{--bg:#f5f2e9;--surface:#faf8f2;--ink:#233a2e;--muted:#6b756c;--line:#cdd2c4;--accent:#306448;--buttonInk:#fffdf5;--highlight:#e2eadb;--body:'Microsoft YaHei',sans-serif;--title:Georgia,'SimSun',serif;--english:Georgia,serif;--number:'Courier New',monospace}header>a{font-weight:normal;letter-spacing:-.5px}header>a small{display:block;font:10px var(--body);letter-spacing:.13em}h1,h2,h3{font-weight:500}.home{padding-top:35px}.hero-title{font-size:59px;margin:22px 0 20px;letter-spacing:-1px}.intro{max-width:810px;font-size:15px;color:var(--muted)}.today-row{display:grid;grid-template-columns:85px 1fr auto;gap:24px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);align-items:center}.folio{font:58px Georgia;color:#9aa998}.today-row p{font-size:14px;color:var(--muted);margin-top:10px}.today-row .primary{background:var(--ink)}.pillars{display:flex;gap:25px;flex-wrap:wrap;margin-top:20px;font-size:13px}.pillars span{padding-left:12px;border-left:2px solid var(--accent)}.feature{font:23px/1.8 var(--title);border-bottom:1px solid var(--line);padding:17px 0}.feature+p{font-size:14px;color:var(--muted);margin-top:12px}@media(max-width:700px){.hero-title{font-size:38px;letter-spacing:0}.today-row{grid-template-columns:40px 1fr;gap:14px}.folio{font-size:36px}.today-row .primary{grid-column:2;justify-self:start}.today-row h2{font-size:23px}.pillars{font-size:12px;gap:14px}}\n@media(max-width:700px){.hero-title{font-size:30px;line-height:1.35}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"#today\">Sentence Forge\u003csmall>ENGLISH / ATLAS\u003c/small>\u003c/a>\u003cnav aria-label=\"学习导航\">\u003cbutton class=\"on\" data-go=\"today\">今天\u003c/button>\u003cbutton data-go=\"map\">学习地图\u003c/button>\u003cbutton data-go=\"evidence\">我的能力\u003c/button>\u003cbutton data-go=\"growth\">成长作品\u003c/button>\u003c/nav>\u003cspan class=\"muted\" style=\"font-size:12px\">学习地图\u003c/span>\u003c/header>\u003cmain>\u003csection class=\"screen home\" data-screen=\"today\">\u003cdiv class=\"flex\">\u003cdiv class=\"kicker\">你的学习旅程 / Chapter 03\u003c/div>\u003cspan class=\"tag\">目标 · 听懂课堂，参与讨论\u003c/span>\u003c/div>\u003ch1 class=\"hero-title\">从“我认识这些词”，\u003cbr>到“我跟得上这句话”。\u003c/h1>\u003cp class=\"intro\">你正在把结构知识转成即时理解。今天先看清一个决定的条件，再把它用在自己的表达里。地图记录你跨过的地方，也指出还需要哪种证据。\u003c/p>\u003cdiv class=\"route\">\u003cdiv class=\"stop \">\u003cspan>01 / 已跨过\u003c/span>\u003cb>找到句子主线\u003c/b>\u003csmall>谁做什么 · 句子骨架\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>02 / 已跨过\u003c/span>\u003cb>把信息接起来\u003c/b>\u003csmall>修饰与限定 · 关系范围\u003c/small>\u003c/div>\u003cdiv class=\"stop current\">\u003cspan>03 / 你在这里\u003c/span>\u003cb>跟上复杂表达\u003c/b>\u003csmall>嵌套与逻辑 · 声音切块\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>04 / 下一段\u003c/span>\u003cb>组织自己的话\u003c/b>\u003csmall>复述 · 理由 · 澄清\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>05 / 将会抵达\u003c/span>\u003cb>参与真实讨论\u003c/b>\u003csmall>课堂互动 · 观点回应\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>06 / 持续生长\u003c/span>\u003cb>处理专业语境\u003c/b>\u003csmall>艺术科技 · 学术论证\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"section\" style=\"padding-top:0\">\u003cdiv class=\"kicker\" style=\"margin-bottom:18px\">今天，只推进这一件事\u003c/div>\u003cdiv class=\"today-row\">\u003cdiv class=\"folio\">03\u003c/div>\u003cdiv>\u003ch2>好用，为什么还要推迟？\u003c/h2>\u003cp>关系理解 → 自己表达 → 新情境回应 · 约 25 分钟\u003c/p>\u003cbutton class=\"link\" data-action=\"why\">为什么给我这项训练？ ↗\u003c/button>\u003cp class=\"why-detail\" hidden>已有词汇和短句基础，但条件与结论还需要更快识别。先分清“某个场景不行”和“永远不行”，下一节用无稿声音观察。\u003c/p>\u003c/div>\u003cbutton class=\"primary\" data-go=\"lesson\">进入今日训练 ↗\u003c/button>\u003c/div>\u003cdiv class=\"pillars\">\u003cspan>已会的短句不重刷\u003c/span>\u003cspan>提示逐步撤掉\u003c/span>\u003cspan>后继随作品调整\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv>\u003cdiv class=\"kicker\">判断从哪里来\u003c/div>\u003cdiv class=\"feature\">读懂 ≠ 听懂。\u003cbr>有提示完成 ≠ 独立迁移。\u003c/div>\u003cp>能力画像保留区别，让你知道为什么今天练它，而不是只给一个分数。\u003c/p>\u003cbutton class=\"link\" data-go=\"evidence\">展开我的能力与证据 →\u003c/button>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">怎样看见进步\u003c/div>\u003cdiv class=\"feature\">从 “We stopped it.”\u003cbr>到说清决定、理由和边界。\u003c/div>\u003cp>初答、改答和新情境作品放在一起。你能看见哪些表达已经变成自己的。\u003c/p>\u003cbutton class=\"link\" data-go=\"growth\">打开成长作品 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"footer\">完整知识地图是底座，近期课程按需安排。不会因做完一批题而到终点，也不会用熟题填补缺口。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"map\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">你的学习坐标 / 目标：听懂课堂，参与讨论\u003c/div>\u003ch1>知道自己在哪里，\u003cbr>也知道接下来去哪。\u003c/h1>\u003cp>六段成长旅程连接结构、声音和表达。你可以跳过已会的内容，也会回到需要补足的地方。\u003c/p>\u003c/div>\u003cdiv class=\"route\">\u003cdiv class=\"stop \">\u003cspan>01 / 已跨过\u003c/span>\u003cb>找到句子主线\u003c/b>\u003csmall>谁做什么 · 句子骨架\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>02 / 已跨过\u003c/span>\u003cb>把信息接起来\u003c/b>\u003csmall>修饰与限定 · 关系范围\u003c/small>\u003c/div>\u003cdiv class=\"stop current\">\u003cspan>03 / 你在这里\u003c/span>\u003cb>跟上复杂表达\u003c/b>\u003csmall>嵌套与逻辑 · 声音切块\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>04 / 下一段\u003c/span>\u003cb>组织自己的话\u003c/b>\u003csmall>复述 · 理由 · 澄清\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>05 / 将会抵达\u003c/span>\u003cb>参与真实讨论\u003c/b>\u003csmall>课堂互动 · 观点回应\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>06 / 持续生长\u003c/span>\u003cb>处理专业语境\u003c/b>\u003csmall>艺术科技 · 学术论证\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"section\">\u003cdiv class=\"flex\">\u003ch2>03 / 跟上复杂表达\u003c/h2>\u003cspan class=\"tag\">当前重心：逻辑关系与实时理解\u003c/span>\u003c/div>\u003cdiv class=\"node-grid\">\u003cbutton class=\"node\" data-node=\"修饰范围\" data-description=\"先找主句，再确定每个修饰挂在哪个对象上；从一个关系句到多层嵌套。熟悉的短句可以挑战后跳过。\">\u003cdiv class=\"kicker\">结构支线 / 已有基础\u003c/div>\u003cb>谁在修饰谁\u003c/b>\u003csmall>限定与补充 → 多层嵌套\u003cbr>用新材料检验，不重刷熟题\u003c/small>\u003c/button>\u003cbutton class=\"node\" data-node=\"限制与让步\" data-description=\"今日先把决定、原因和条件分开，再迁移到自己的项目回应。无稿听力和开放输出分别观察，不相互冒充。\">\u003cdiv class=\"kicker\">当前节点 / 今日训练\u003c/div>\u003cb>好用，为什么还要推迟\u003c/b>\u003csmall>关系理解 → 声音切块 → 自己表达\u003cbr>今天从可见材料开始\u003c/small>\u003c/button>\u003cbutton class=\"node\" data-node=\"持续跟上课堂\" data-description=\"短讲里抓住主线；听漏时记录缺口并继续跟上。再练请求澄清、确认理解和回答老师的追问。\">\u003cdiv class=\"kicker\">后继任务 / 随表现调整\u003c/div>\u003cb>听漏一句，也能继续\u003c/b>\u003csmall>课堂短讲 → 澄清 → 即时回应\u003cbr>支持会逐步撤掉\u003c/small>\u003c/button>\u003c/div>\u003cdiv class=\"panel\">\u003ch3 id=\"node-title\">当前位置是一个能力节点，不是一道题\u003c/h3>\u003cp id=\"node-detail\">同一节点可以用不同材料、难度和技能练习。你学会的是理解与表达关系的方法；下一节不必重复同一句话。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"three\">\u003cdiv class=\"panel\">\u003ch3>先定位，再选起点\u003c/h3>\u003cp>挑战逐渐变难，卡住后再区分：词音不熟、关系没抓到，还是表达调不出来。未测到的能力保留未知。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>主线稳定，课程会生长\u003c/h3>\u003cp>完整知识地图是底座。近期课程按需生成并审核，根据作品调整材料、支持与复杂度。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>熟悉内容可以跳过\u003c/h3>\u003cp>不用重头刷。独立挑战可支持跳过；申请免修只改变安排，不自动证明掌握。\u003c/p>\u003c/div>\u003c/div>\u003cdetails class=\"panel\" style=\"margin-top:25px\">\u003csummary style=\"cursor:pointer;font-weight:bold\">六段路线下面，到底覆盖哪些知识？\u003c/summary>\u003cp>路线是易读的导航；完整知识面藏在下面，不把英语缩成六个小章节。\u003c/p>\u003cdiv class=\"three\" style=\"margin-top:20px\">\u003cdiv>\u003ch3>句子怎样搭起来\u003c/h3>\u003cp>主线与句型 · 动词与论元 · 名词短语 · 限定与指代 · 修饰范围 · 关系句与嵌套\u003c/p>\u003c/div>\u003cdiv>\u003ch3>意义怎样精确表达\u003c/h3>\u003cp>时态与体 · 情态 · 被动 · 否定与疑问 · 比较 · 条件与假设 · 非限定形式 · 省略与强调\u003c/p>\u003c/div>\u003cdiv>\u003ch3>信息怎样成为交流\u003c/h3>\u003cp>衔接与信息焦点 · 语用与语域 · 词汇搭配与语块 · 连读弱读与韵律 · 澄清与互动 · 学术论证与回应\u003c/p>\u003c/div>\u003c/div>\u003cp>同一结构沿复杂度深入，同时在听、说、读、写中迁移。底层知识地图组织完整范围；个人路径只挑现在需要的节点。\u003c/p>\u003c/details>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">从当前节点开始 →\u003c/button>\u003cbutton class=\"secondary\" data-go=\"evidence\">展开听说读写的证据\u003c/button>\u003c/div>\u003cdiv class=\"footer\">路线连接句子结构、时体与语气、信息组织、词汇语块、声音理解、互动表达与学术应用。阶段位置表示任务方向，不是整体英语能力百分比。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"lesson\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">今日任务 / 关系理解 → 自己表达\u003c/div>\u003ch1>好用，为什么还要推迟？\u003c/h1>\u003cp>分清一个方案有效的条件，再说清自己会怎样决定。约 25 分钟。\u003c/p>\u003c/div>\u003cdiv class=\"stage-buttons\">\u003cbutton class=\"on\" data-step=\"0\">01 读懂\u003c/button>\u003cbutton data-step=\"1\">02 讲清原理\u003c/button>\u003cbutton data-step=\"2\">03 自己说\u003c/button>\u003cbutton data-step=\"3\">04 换情境\u003c/button>\u003c/div>\u003cdiv class=\"lesson-grid\">\u003cdiv class=\"lesson\">\u003cdiv class=\"stage\" data-stage=\"0\">\u003cdiv class=\"kicker\">排练室里的决定\u003c/div>\u003cp class=\"english\">\u003cmark>Although\u003c/mark> our voice prototype worked well in a quiet studio, it failed during a crowded exhibition. We kept the gesture controls, \u003cmark>but\u003c/mark> we delayed voice control until we could test it with visitors in the exhibition hall.\u003c/p>\u003ch3>团队作出的决定是什么？\u003c/h3>\u003cdiv class=\"options\">\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"0\">语音没有用，所以以后永远不用。\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"1\">保留手势控制，语音控制推迟到能在展厅测试时。\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-action=\"check\">查看判断依据 ↗\u003c/button>\u003cbutton class=\"secondary\" data-action=\"hint\">给我一个提示\u003c/button>\u003c/div>\u003cdiv id=\"choice-feedback\" class=\"feedback\" hidden>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"1\" hidden>\u003cdiv class=\"kicker\">把新情况归到原来的原理里\u003c/div>\u003ch2>先找主线，再看\u003cbr>它在哪种条件下成立。\u003c/h2>\u003cp>“在安静工作室有效”和“在人多的展厅失灵”可以同时成立。\u003cb>although\u003c/b> 承认前一个事实，同时引出后一个事实，没有把方案直接否定。\u003c/p>\u003cp>最后的决定是 kept 与 delayed。\u003cb>until we could test…\u003c/b> 指明推迟的时间边界。原文没有保证测试之后一定采用，也没有说永久取消。\u003c/p>\u003cdiv class=\"feedback\">判断靠对象、场景、决定和条件的真实关系。but 后面并不总是限制。\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-step=\"2\">换成自己的话 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"2\" hidden>\u003cdiv class=\"kicker\">输出 / 课堂里能用得上\u003c/div>\u003ch2>用 2–3 句英语\u003cbr>讲清这次决定。\u003c/h2>\u003cp>设想同学问：“Why did you delay voice control?” 说清原因与条件。再把同样的表达用在自己的一个项目上。\u003c/p>\u003ctextarea aria-label=\"你的英语回应\" placeholder=\"We kept… but we delayed… because…\">\u003c/textarea>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-action=\"reference\">对照参考表达与依据 ↗\u003c/button>\u003c/div>\u003cdiv id=\"expression-reference\" class=\"feedback\" hidden>\u003cb>一种自然表达\u003c/b>\u003cp>We kept gesture control, but postponed voice control because it failed in the crowded exhibition. We need to test it with visitors before taking the next step.\u003c/p>\u003cp>对照你的作品：保留与推迟的对象是否说对？有没有把暂时推迟说成永久取消？理解你的表达要看意思和关系，词表只能提供线索。\u003c/p>\u003cbutton class=\"link\" data-step=\"3\">继续做无法照抄的新任务 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"3\" hidden>\u003cdiv class=\"kicker\">迁移 / 不靠记住原句\u003c/div>\u003ch2>换了场景，\u003cbr>你还能用出来吗？\u003c/h2>\u003cp>你的互动展览在小房间运行流畅，但大厅里会延迟。老师问：“Should we cancel the installation?”\u003c/p>\u003cdiv class=\"panel\" style=\"margin-top:22px\">\u003ch3>回应这个问题\u003c/h3>\u003cp>说明你会保留什么，再说明什么需要调整或测试。方案可以不同，只要理由与条件清楚。\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"growth\">这种任务怎样记录成长？ ↗\u003c/button>\u003cbutton class=\"secondary\" data-go=\"map\">它在路线的什么位置？\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003caside class=\"aside\">\u003cspan class=\"tag\">结构 03 · 限制与让步\u003c/span>\u003ch3>为什么现在练它？\u003c/h3>\u003cp>词汇与短句已有基础，但长句里“结论在哪里、条件是什么”还会慢一步。先把关系读清，再用无稿听力验证声音里的同一关系。\u003c/p>\u003ch3>这次观察什么\u003c/h3>\u003cp>理解关系，不是背定义。看提示后的完成是补练；独立完成新情境，才是更强的证据。\u003c/p>\u003cbutton class=\"link\" data-go=\"evidence\">系统怎样判断我的能力？\u003c/button>\u003c/aside>\u003c/div>\u003cdiv class=\"footer\">失败可以提示、重试、查词或提出表达争议。一次错题不会直接把你归为“不懂这项”。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"evidence\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">能力画像 / 判断有依据，也有边界\u003c/div>\u003ch1>不是做对几题，\u003cbr>就说你已经会了。\u003c/h1>\u003cp>听、说、读、写分别看；任务难度、支持条件和新情境表现共同构成判断依据。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv>\u003cdiv class=\"skill\">\u003cstrong>听\u003c/strong>\u003cdiv>\u003cb>有稿能理解，无稿会卡在关系词\u003c/b>\u003cp>换声音、无字幕再检验，不把看稿成功记为独立听懂。\u003c/p>\u003csmall>正在练 · 需要支持\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>说\u003c/strong>\u003cdiv>\u003cb>能用短句回答，长回应需要准备\u003c/b>\u003cp>用自己的项目说明决定，再接一个不知道的问题。\u003c/p>\u003csmall>初步观察 · 待迁移\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>读\u003c/strong>\u003cdiv>\u003cb>能抓主线，复杂修饰仍需核对范围\u003c/b>\u003cp>在不同材料找到主句；更深的嵌套等待新任务证据。\u003c/p>\u003csmall>已独立完成 · 部分范围\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>写\u003c/strong>\u003cdiv>\u003cb>能表达决定，条件与让步还需练习\u003c/b>\u003cp>作品足以安排补练，不足以判断更长学术写作。\u003c/p>\u003csmall>已有作品 · 尚未全面测量\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">展开一项判断\u003c/div>\u003ch2 style=\"margin-top:14px\">“逻辑关系”\u003cbr>到底会到什么程度？\u003c/h2>\u003cdiv class=\"tabs\">\u003cbutton class=\"on\" data-evidence=\"supported\">有支持完成\u003c/button>\u003cbutton data-evidence=\"independent\">独立完成\u003c/button>\u003cbutton data-evidence=\"unknown\">尚未测量\u003c/button>\u003c/div>\u003cdiv id=\"evidence-detail\">\u003ch3>看了稿，分清保留与推迟\u003c/h3>\u003cp>说明能在文字支持下理解关系。需要新无稿音频观察是否能实时听懂。\u003c/p>\u003c/div>\u003cdiv class=\"proof-item\">\u003cb>作品与条件\u003c/b>\u003cp>排练记录的决定复述 · 第二次尝试 · 提示一次 · 看过原文\u003c/p>\u003c/div>\u003cdiv class=\"proof-item\">\u003cb>下一次怎样确认\u003c/b>\u003cp>换一个声音和情境，不给稿，再接一个追问。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"section three\">\u003cdiv>\u003cdiv class=\"kicker\">01 / 定位\u003c/div>\u003ch3>先形成教学假设\u003c/h3>\u003cp class=\"muted\">几道题选起点，不给你贴一个终身等级。\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">02 / 观察\u003c/div>\u003ch3>作品累积真实证据\u003c/h3>\u003cp class=\"muted\">独立完成、支持条件、换场景后的表现。\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">03 / 调节\u003c/div>\u003ch3>课程随证据变化\u003c/h3>\u003cp class=\"muted\">撤掉支持、增加复杂度，或补足具体缺口。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">知道原因后，继续练 →\u003c/button>\u003c/div>\u003cdiv class=\"footer\">一次错题不确定根因。转写、关键词命中和跟读次数不代表口语流利度或真实理解。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"growth\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">成长档案 / 记住真正跨过的地方\u003c/div>\u003ch1>进步是这句话，\u003cbr>现在你能说清楚了。\u003c/h1>\u003cp>比较作品和完成条件，比比较刷题数量更有意义。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"work\">\u003cdiv class=\"kicker\">原来的回应 / 需要提示\u003c/div>\u003cblockquote>“It didn't work.\u003cbr>We stopped it.”\u003c/blockquote>\u003cp>说了结果，却没有说清对象、原因和条件，把暂时推迟说成停止。\u003c/p>\u003c/div>\u003cdiv class=\"work new\">\u003cdiv class=\"kicker\">新的回应 / 同一类表达\u003c/div>\u003cblockquote>“We kept gesture control, but delayed voice control until we could test it in the exhibition hall.”\u003c/blockquote>\u003cp>决定、对象和时间边界都表达出来了。下一步在新情境独立回应，确认能迁移。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"section\">\u003ch2>这次之后，课程怎样变化？\u003c/h2>\u003cdiv class=\"three\" style=\"margin-top:24px\">\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">保留\u003c/div>\u003ch3>继续练声音里的条件\u003c/h3>\u003cp>关系能看明白，还要听得及时。换讲者，不刷旧文。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">减少\u003c/div>\u003ch3>撤掉不再需要的提示\u003c/h3>\u003cp>新材料先无稿试；卡住再给分段和关键词帮助。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">增加\u003c/div>\u003ch3>加入自己的项目回应\u003c/h3>\u003cp>用同一关系回答新问题，观点不同也可以。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"map\">看看更新后的下一站 →\u003c/button>\u003cbutton class=\"secondary\" data-go=\"evidence\">变化有哪些证据？\u003c/button>\u003c/div>\u003cdiv class=\"footer\">需要提示的进步值得保留。更强的能力结论等待独立迁移和后续观察。\u003c/div>\u003c/section>\n\n\u003c/main>\u003cscript>function go(n){document.querySelectorAll('.screen').forEach(x=>x.hidden=x.dataset.screen!==n);document.querySelectorAll('nav [data-go]').forEach(x=>x.classList.toggle('on',x.dataset.go===n));scrollTo(0,0);if(n==='lesson')step(0)}function step(n){document.querySelectorAll('.stage').forEach(x=>x.hidden=+x.dataset.stage!==+n);document.querySelectorAll('.stage-buttons button').forEach(x=>x.classList.toggle('on',+x.dataset.step===+n))}document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-step],[data-action],[data-node],[data-evidence]');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.step!==undefined)step(b.dataset.step);if(b.dataset.action==='why'){const d=b.nextElementSibling;d.hidden=!d.hidden;b.textContent=d.hidden?'为什么给我这项训练？ ↗':'收起训练依据 ↑'}if(b.dataset.action==='check'){const out=document.querySelector('#choice-feedback'),v=document.querySelector('input[name=decision]:checked');out.hidden=false;out.textContent=!v?'先选一个决定。可以回到原文看 kept 和 delayed。':v.value==='1'?'判断与原文一致：留下手势控制，语音推迟到能够测试时，不是永久取消。':'这里把暂时推迟当成永久取消。原文是 delayed…until…，先看条件，再试一次。';if(v&&v.value==='1'){const next=document.createElement('button');next.className='link';next.dataset.step='1';next.textContent='揭晓原理，进入下一步 →';out.append(document.createElement('br'),next)}}if(b.dataset.action==='hint'){const out=document.querySelector('#choice-feedback');out.hidden=false;out.textContent='分别圈出 kept 和 delayed 后面的对象，再找 until 后面的条件。先不判断方案好坏。'}if(b.dataset.action==='reference')document.querySelector('#expression-reference').hidden=false;if(b.dataset.node){document.querySelector('#node-title').textContent=b.dataset.node;document.querySelector('#node-detail').textContent=b.dataset.description}if(b.dataset.evidence){document.querySelectorAll('[data-evidence]').forEach(x=>x.classList.toggle('on',x===b));const values={supported:['看了稿，分清保留与推迟','说明能在文字支持下理解关系，需要新无稿音频观察是否能实时听懂。'],independent:['换了材料，仍能找到主线','独立完成新阅读关系任务，支持这个复杂度范围的判断，不能直接推出独立听懂或自由口述。'],unknown:['更长的课堂回应，还没有足够作品','这不是 0 分，也不是落后。下一次用新任务观察，不凭词汇量或一次短答猜测。']};const d=values[b.dataset.evidence],h=document.createElement('h3'),p=document.createElement('p');h.textContent=d[0];p.textContent=d[1];document.querySelector('#evidence-detail').replaceChildren(h,p)}});\n\u003c/script>\u003c/body>\u003c/html>", "sourceLabel": "atlas.html", "baseline": false, "interactive": true}, {"id": "studio", "name": "表达工作室", "concept": "像进入练习工作室，以真实回应为主角，地图为每个动作提供方向。", "typography": "Bahnschrift 英文与标题；微软雅黑中文；Consolas编号。52px标题，36px语言片段。", "palette": ["#17191F", "#C0A8F7", "#F2F1F8"], "traits": ["任务台与纵向理解/输出/迁移", "紫色语言片段与声音节奏", "技能与作品在工作台下方展开"], "kind": "html", "content": "\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=( id{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:36px}.lesson{padding:32px;border:1px solid var(--line);background:var(--surface)}.english{font:29px/1.75 var(--english);margin:22px 0}mark{background:var(--highlight);color:var(--ink)}.options{display:grid;gap:10px;margin:22px 0}.options label{display:flex;gap:12px;padding:16px;border:1px solid var(--line);font-size:14px;line-height:1.7}.feedback{padding:20px;background:var(--highlight);font-size:15px;line-height:1.8;margin-top:18px}.aside p{font-size:14px;color:var(--muted);margin:15px 0 25px}.aside h3{margin-top:20px}.stage>p{margin-top:20px}.stage textarea{width:100%;min-height:135px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:18px;margin-top:20px;resize:vertical;font-size:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border:1px solid var(--line);background:none;color:var(--ink);padding:9px 11px;font-size:13px}.tabs button.on{background:var(--ink);color:var(--bg)}.proof-item{border-left:2px solid var(--line);padding-left:19px;margin-top:24px;font-size:14px}.proof-item p{color:var(--muted);margin-top:6px}.work{padding:28px;border:1px solid var(--line)}.work blockquote{font:25px/1.7 var(--english);margin:20px 0}.work p{font-size:14px;color:var(--muted)}.work.new{background:var(--highlight)}@media(max-width:700px){header{padding:20px 22px;flex-wrap:wrap;gap:17px}header nav{width:100%}nav button{padding:9px 11px;font-size:13px}header>.muted{display:none}main{padding:0 22px}.grid,.three,.lesson-grid,.node-grid{grid-template-columns:1fr}.route{grid-template-columns:repeat(3,1fr)}.stop{padding:17px 6px 17px 0}.stop b{font-size:14px}.stop small{font-size:11px}.flex{flex-direction:column;gap:12px}.page-head h1{font-size:34px}.lesson{padding:22px}.english{font-size:24px}.aside{border-top:1px solid var(--line);padding-top:20px}.section{padding:28px 0}.panel{padding:22px}.primary,.secondary{padding:13px 17px}.stage-buttons button{padding:8px 10px;font-size:13px}h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}\n:root{--bg:#17191f;--surface:#22252e;--ink:#f2f1f8;--muted:#aaaaba;--line:#3c3d4b;--accent:#c0a8f7;--buttonInk:#201a31;--highlight:#343047;--body:'Microsoft YaHei',sans-serif;--title:Bahnschrift,'Microsoft YaHei',sans-serif;--english:Bahnschrift,sans-serif;--number:Consolas,monospace}header{justify-content:flex-start;gap:55px}header>a{color:var(--accent);letter-spacing:1px}header>.muted{margin-left:auto;font-size:12px}.session-bar{display:flex;justify-content:space-between;margin:28px 0}.workbench{display:grid;grid-template-columns:75px minmax(0,1fr) 245px;gap:25px}.modes{display:flex;flex-direction:column;gap:12px}.modes div{border:1px solid var(--line);border-radius:10px;padding:19px 5px;text-align:center;font-size:12px;color:var(--muted)}.modes div:first-child{background:var(--accent);color:var(--buttonInk)}.core{padding:28px 0}.core h1{font-size:52px;margin-top:12px;letter-spacing:-1px}.core .intro{font-size:15px;color:var(--muted);max-width:640px;margin-top:20px}.phrase{font:36px/1.5 var(--title);color:#e7dbff;margin:33px 0 22px;max-width:700px}.phrase span{color:#9496ab}.wave{display:flex;gap:4px;align-items:center;height:38px;margin:20px 0}.wave i{width:3px;background:var(--accent);border-radius:2px}.coordinates{padding-top:32px}.coordinate{border-top:1px solid var(--line);padding-top:17px;margin-top:20px}.coordinate b{display:block;font:20px var(--title);margin-top:8px}.coordinates p{color:var(--muted);font-size:13px;margin:13px 0 24px}.blocks{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:25px;border-top:1px solid var(--line);padding:25px 0}.blocks button{background:none;text-align:left;color:var(--ink);padding:8px 0}.blocks h3{margin:10px 0}.blocks p{font-size:13px;color:var(--muted)}.panel,.work,.lesson{border-radius:14px}.primary,.secondary{border-radius:8px}@media(max-width:700px){header{gap:20px}.workbench{grid-template-columns:1fr;gap:0}.modes{flex-direction:row}.modes div{padding:10px 20px}.core h1{font-size:36px}.phrase{font-size:28px}.coordinates{display:none}.blocks{grid-template-columns:1fr;gap:12px}.blocks button{border-bottom:1px solid var(--line);padding-bottom:18px}.core{padding:20px 0}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"#today\">FORGE / STUDIO\u003c/a>\u003cnav aria-label=\"学习导航\">\u003cbutton class=\"on\" data-go=\"today\">今天\u003c/button>\u003cbutton data-go=\"map\">学习地图\u003c/button>\u003cbutton data-go=\"evidence\">我的能力\u003c/button>\u003cbutton data-go=\"growth\">成长作品\u003c/button>\u003c/nav>\u003cspan class=\"muted\" style=\"font-size:12px\">表达工作室\u003c/span>\u003c/header>\u003cmain>\u003csection class=\"screen home\" data-screen=\"today\">\u003cdiv class=\"session-bar\">\u003cdiv class=\"kicker\">Today's session / 25 MIN\u003c/div>\u003cspan class=\"tag\">听懂 → 解释 → 回应\u003c/span>\u003c/div>\u003cdiv class=\"workbench\">\u003cdiv class=\"modes\">\u003cdiv>理解\u003c/div>\u003cdiv>输出\u003c/div>\u003cdiv>迁移\u003c/div>\u003c/div>\u003cdiv class=\"core\">\u003cdiv class=\"kicker\">你的表达工作室\u003c/div>\u003ch1>听出关系，\u003cbr>接得上话。\u003c/h1>\u003cp class=\"intro\">今天解释一个设计决定。面对同学的追问，能说清自己为什么这样做，才是这次训练要解决的事。\u003c/p>\u003cdiv class=\"phrase\">\u003cspan>Although it worked in the studio,\u003c/span>\u003cbr>we delayed voice control.\u003c/div>\u003cdiv class=\"wave\" aria-hidden=\"true\">\u003ci style=\"height:8px\">\u003c/i>\u003ci style=\"height:17px\">\u003c/i>\u003ci style=\"height:29px\">\u003c/i>\u003ci style=\"height:12px\">\u003c/i>\u003ci style=\"height:23px\">\u003c/i>\u003ci style=\"height:36px\">\u003c/i>\u003ci style=\"height:25px\">\u003c/i>\u003ci style=\"height:13px\">\u003c/i>\u003ci style=\"height:33px\">\u003c/i>\u003ci style=\"height:19px\">\u003c/i>\u003ci style=\"height:8px\">\u003c/i>\u003ci style=\"height:20px\">\u003c/i>\u003ci style=\"height:32px\">\u003c/i>\u003ci style=\"height:22px\">\u003c/i>\u003ci style=\"height:12px\">\u003c/i>\u003ci style=\"height:26px\">\u003c/i>\u003ci style=\"height:17px\">\u003c/i>\u003ci style=\"height:9px\">\u003c/i>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">进入今天的任务 ↗\u003c/button>\u003cbutton class=\"secondary\" data-go=\"map\">展开我的路线\u003c/button>\u003c/div>\u003cbutton class=\"link\" data-action=\"why\">为什么给我这项训练？ ↗\u003c/button>\u003cp class=\"why-detail muted\" hidden>你已有词汇基础，但需要更快识别事实、决定和条件。先在可见材料里理清，再逐步撤稿、换声音、迁移到自己的回应。\u003c/p>\u003c/div>\u003caside class=\"coordinates\">\u003cdiv class=\"kicker\">你的坐标\u003c/div>\u003cdiv class=\"coordinate\">\u003cspan class=\"muted\">当前阶段\u003c/span>\u003cb>03 / 跟上复杂表达\u003c/b>\u003c/div>\u003cp>语法成为理解工具，随后进入声音和回应。每种技能分开观察。\u003c/p>\u003cdiv class=\"coordinate\">\u003cspan class=\"muted\">当前节点\u003c/span>\u003cb>限制与让步\u003c/b>\u003c/div>\u003cp>先把信息接起来，再用自己的话处理新情境。\u003c/p>\u003cbutton class=\"link\" data-go=\"map\">展开结构路线 →\u003c/button>\u003c/aside>\u003c/div>\u003cdiv class=\"blocks\">\u003cbutton data-go=\"evidence\">\u003cdiv class=\"kicker\">听说读写 / 分别看\u003c/div>\u003ch3>看得懂，还要听得及时\u003c/h3>\u003cp>有稿完成和无稿理解分开记录。\u003cbr>查看判断依据 →\u003c/p>\u003c/button>\u003cbutton data-go=\"growth\">\u003cdiv class=\"kicker\">作品回放\u003c/div>\u003ch3>把“停止了”说得更准确\u003c/h3>\u003cp>初答 → 改答 → 新任务作品。\u003cbr>看到表达的变化 →\u003c/p>\u003c/button>\u003cbutton data-go=\"map\">\u003cdiv class=\"kicker\">下一节会怎样变化\u003c/div>\u003ch3>撤掉支持，换一个问题\u003c/h3>\u003cp>已明白就换声音和情境；卡住就补具体缺口。\u003cbr>看后继任务 →\u003c/p>\u003c/button>\u003c/div>\u003cdiv class=\"footer\">训练连接真实交流动作：听懂决定、确认条件、解释理由或接住追问。你学到哪里，课程沿着地图生长到哪里。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"map\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">你的学习坐标 / 目标：听懂课堂，参与讨论\u003c/div>\u003ch1>知道自己在哪里，\u003cbr>也知道接下来去哪。\u003c/h1>\u003cp>六段成长旅程连接结构、声音和表达。你可以跳过已会的内容，也会回到需要补足的地方。\u003c/p>\u003c/div>\u003cdiv class=\"route\">\u003cdiv class=\"stop \">\u003cspan>01 / 已跨过\u003c/span>\u003cb>找到句子主线\u003c/b>\u003csmall>谁做什么 · 句子骨架\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>02 / 已跨过\u003c/span>\u003cb>把信息接起来\u003c/b>\u003csmall>修饰与限定 · 关系范围\u003c/small>\u003c/div>\u003cdiv class=\"stop current\">\u003cspan>03 / 你在这里\u003c/span>\u003cb>跟上复杂表达\u003c/b>\u003csmall>嵌套与逻辑 · 声音切块\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>04 / 下一段\u003c/span>\u003cb>组织自己的话\u003c/b>\u003csmall>复述 · 理由 · 澄清\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>05 / 将会抵达\u003c/span>\u003cb>参与真实讨论\u003c/b>\u003csmall>课堂互动 · 观点回应\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>06 / 持续生长\u003c/span>\u003cb>处理专业语境\u003c/b>\u003csmall>艺术科技 · 学术论证\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"section\">\u003cdiv class=\"flex\">\u003ch2>03 / 跟上复杂表达\u003c/h2>\u003cspan class=\"tag\">当前重心：逻辑关系与实时理解\u003c/span>\u003c/div>\u003cdiv class=\"node-grid\">\u003cbutton class=\"node\" data-node=\"修饰范围\" data-description=\"先找主句，再确定每个修饰挂在哪个对象上；从一个关系句到多层嵌套。熟悉的短句可以挑战后跳过。\">\u003cdiv class=\"kicker\">结构支线 / 已有基础\u003c/div>\u003cb>谁在修饰谁\u003c/b>\u003csmall>限定与补充 → 多层嵌套\u003cbr>用新材料检验，不重刷熟题\u003c/small>\u003c/button>\u003cbutton class=\"node\" data-node=\"限制与让步\" data-description=\"今日先把决定、原因和条件分开，再迁移到自己的项目回应。无稿听力和开放输出分别观察，不相互冒充。\">\u003cdiv class=\"kicker\">当前节点 / 今日训练\u003c/div>\u003cb>好用，为什么还要推迟\u003c/b>\u003csmall>关系理解 → 声音切块 → 自己表达\u003cbr>今天从可见材料开始\u003c/small>\u003c/button>\u003cbutton class=\"node\" data-node=\"持续跟上课堂\" data-description=\"短讲里抓住主线；听漏时记录缺口并继续跟上。再练请求澄清、确认理解和回答老师的追问。\">\u003cdiv class=\"kicker\">后继任务 / 随表现调整\u003c/div>\u003cb>听漏一句，也能继续\u003c/b>\u003csmall>课堂短讲 → 澄清 → 即时回应\u003cbr>支持会逐步撤掉\u003c/small>\u003c/button>\u003c/div>\u003cdiv class=\"panel\">\u003ch3 id=\"node-title\">当前位置是一个能力节点，不是一道题\u003c/h3>\u003cp id=\"node-detail\">同一节点可以用不同材料、难度和技能练习。你学会的是理解与表达关系的方法；下一节不必重复同一句话。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"three\">\u003cdiv class=\"panel\">\u003ch3>先定位，再选起点\u003c/h3>\u003cp>挑战逐渐变难，卡住后再区分：词音不熟、关系没抓到，还是表达调不出来。未测到的能力保留未知。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>主线稳定，课程会生长\u003c/h3>\u003cp>完整知识地图是底座。近期课程按需生成并审核，根据作品调整材料、支持与复杂度。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>熟悉内容可以跳过\u003c/h3>\u003cp>不用重头刷。独立挑战可支持跳过；申请免修只改变安排，不自动证明掌握。\u003c/p>\u003c/div>\u003c/div>\u003cdetails class=\"panel\" style=\"margin-top:25px\">\u003csummary style=\"cursor:pointer;font-weight:bold\">六段路线下面，到底覆盖哪些知识？\u003c/summary>\u003cp>路线是易读的导航；完整知识面藏在下面，不把英语缩成六个小章节。\u003c/p>\u003cdiv class=\"three\" style=\"margin-top:20px\">\u003cdiv>\u003ch3>句子怎样搭起来\u003c/h3>\u003cp>主线与句型 · 动词与论元 · 名词短语 · 限定与指代 · 修饰范围 · 关系句与嵌套\u003c/p>\u003c/div>\u003cdiv>\u003ch3>意义怎样精确表达\u003c/h3>\u003cp>时态与体 · 情态 · 被动 · 否定与疑问 · 比较 · 条件与假设 · 非限定形式 · 省略与强调\u003c/p>\u003c/div>\u003cdiv>\u003ch3>信息怎样成为交流\u003c/h3>\u003cp>衔接与信息焦点 · 语用与语域 · 词汇搭配与语块 · 连读弱读与韵律 · 澄清与互动 · 学术论证与回应\u003c/p>\u003c/div>\u003c/div>\u003cp>同一结构沿复杂度深入，同时在听、说、读、写中迁移。底层知识地图组织完整范围；个人路径只挑现在需要的节点。\u003c/p>\u003c/details>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">从当前节点开始 →\u003c/button>\u003cbutton class=\"secondary\" data-go=\"evidence\">展开听说读写的证据\u003c/button>\u003c/div>\u003cdiv class=\"footer\">路线连接句子结构、时体与语气、信息组织、词汇语块、声音理解、互动表达与学术应用。阶段位置表示任务方向，不是整体英语能力百分比。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"lesson\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">今日任务 / 关系理解 → 自己表达\u003c/div>\u003ch1>好用，为什么还要推迟？\u003c/h1>\u003cp>分清一个方案有效的条件，再说清自己会怎样决定。约 25 分钟。\u003c/p>\u003c/div>\u003cdiv class=\"stage-buttons\">\u003cbutton class=\"on\" data-step=\"0\">01 读懂\u003c/button>\u003cbutton data-step=\"1\">02 讲清原理\u003c/button>\u003cbutton data-step=\"2\">03 自己说\u003c/button>\u003cbutton data-step=\"3\">04 换情境\u003c/button>\u003c/div>\u003cdiv class=\"lesson-grid\">\u003cdiv class=\"lesson\">\u003cdiv class=\"stage\" data-stage=\"0\">\u003cdiv class=\"kicker\">排练室里的决定\u003c/div>\u003cp class=\"english\">\u003cmark>Although\u003c/mark> our voice prototype worked well in a quiet studio, it failed during a crowded exhibition. We kept the gesture controls, \u003cmark>but\u003c/mark> we delayed voice control until we could test it with visitors in the exhibition hall.\u003c/p>\u003ch3>团队作出的决定是什么？\u003c/h3>\u003cdiv class=\"options\">\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"0\">语音没有用，所以以后永远不用。\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"1\">保留手势控制，语音控制推迟到能在展厅测试时。\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-action=\"check\">查看判断依据 ↗\u003c/button>\u003cbutton class=\"secondary\" data-action=\"hint\">给我一个提示\u003c/button>\u003c/div>\u003cdiv id=\"choice-feedback\" class=\"feedback\" hidden>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"1\" hidden>\u003cdiv class=\"kicker\">把新情况归到原来的原理里\u003c/div>\u003ch2>先找主线，再看\u003cbr>它在哪种条件下成立。\u003c/h2>\u003cp>“在安静工作室有效”和“在人多的展厅失灵”可以同时成立。\u003cb>although\u003c/b> 承认前一个事实，同时引出后一个事实，没有把方案直接否定。\u003c/p>\u003cp>最后的决定是 kept 与 delayed。\u003cb>until we could test…\u003c/b> 指明推迟的时间边界。原文没有保证测试之后一定采用，也没有说永久取消。\u003c/p>\u003cdiv class=\"feedback\">判断靠对象、场景、决定和条件的真实关系。but 后面并不总是限制。\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-step=\"2\">换成自己的话 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"2\" hidden>\u003cdiv class=\"kicker\">输出 / 课堂里能用得上\u003c/div>\u003ch2>用 2–3 句英语\u003cbr>讲清这次决定。\u003c/h2>\u003cp>设想同学问：“Why did you delay voice control?” 说清原因与条件。再把同样的表达用在自己的一个项目上。\u003c/p>\u003ctextarea aria-label=\"你的英语回应\" placeholder=\"We kept… but we delayed… because…\">\u003c/textarea>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-action=\"reference\">对照参考表达与依据 ↗\u003c/button>\u003c/div>\u003cdiv id=\"expression-reference\" class=\"feedback\" hidden>\u003cb>一种自然表达\u003c/b>\u003cp>We kept gesture control, but postponed voice control because it failed in the crowded exhibition. We need to test it with visitors before taking the next step.\u003c/p>\u003cp>对照你的作品：保留与推迟的对象是否说对？有没有把暂时推迟说成永久取消？理解你的表达要看意思和关系，词表只能提供线索。\u003c/p>\u003cbutton class=\"link\" data-step=\"3\">继续做无法照抄的新任务 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"3\" hidden>\u003cdiv class=\"kicker\">迁移 / 不靠记住原句\u003c/div>\u003ch2>换了场景，\u003cbr>你还能用出来吗？\u003c/h2>\u003cp>你的互动展览在小房间运行流畅，但大厅里会延迟。老师问：“Should we cancel the installation?”\u003c/p>\u003cdiv class=\"panel\" style=\"margin-top:22px\">\u003ch3>回应这个问题\u003c/h3>\u003cp>说明你会保留什么，再说明什么需要调整或测试。方案可以不同，只要理由与条件清楚。\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"growth\">这种任务怎样记录成长？ ↗\u003c/button>\u003cbutton class=\"secondary\" data-go=\"map\">它在路线的什么位置？\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003caside class=\"aside\">\u003cspan class=\"tag\">结构 03 · 限制与让步\u003c/span>\u003ch3>为什么现在练它？\u003c/h3>\u003cp>词汇与短句已有基础，但长句里“结论在哪里、条件是什么”还会慢一步。先把关系读清，再用无稿听力验证声音里的同一关系。\u003c/p>\u003ch3>这次观察什么\u003c/h3>\u003cp>理解关系，不是背定义。看提示后的完成是补练；独立完成新情境，才是更强的证据。\u003c/p>\u003cbutton class=\"link\" data-go=\"evidence\">系统怎样判断我的能力？\u003c/button>\u003c/aside>\u003c/div>\u003cdiv class=\"footer\">失败可以提示、重试、查词或提出表达争议。一次错题不会直接把你归为“不懂这项”。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"evidence\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">能力画像 / 判断有依据，也有边界\u003c/div>\u003ch1>不是做对几题，\u003cbr>就说你已经会了。\u003c/h1>\u003cp>听、说、读、写分别看；任务难度、支持条件和新情境表现共同构成判断依据。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv>\u003cdiv class=\"skill\">\u003cstrong>听\u003c/strong>\u003cdiv>\u003cb>有稿能理解，无稿会卡在关系词\u003c/b>\u003cp>换声音、无字幕再检验，不把看稿成功记为独立听懂。\u003c/p>\u003csmall>正在练 · 需要支持\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>说\u003c/strong>\u003cdiv>\u003cb>能用短句回答，长回应需要准备\u003c/b>\u003cp>用自己的项目说明决定，再接一个不知道的问题。\u003c/p>\u003csmall>初步观察 · 待迁移\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>读\u003c/strong>\u003cdiv>\u003cb>能抓主线，复杂修饰仍需核对范围\u003c/b>\u003cp>在不同材料找到主句；更深的嵌套等待新任务证据。\u003c/p>\u003csmall>已独立完成 · 部分范围\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>写\u003c/strong>\u003cdiv>\u003cb>能表达决定，条件与让步还需练习\u003c/b>\u003cp>作品足以安排补练，不足以判断更长学术写作。\u003c/p>\u003csmall>已有作品 · 尚未全面测量\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">展开一项判断\u003c/div>\u003ch2 style=\"margin-top:14px\">“逻辑关系”\u003cbr>到底会到什么程度？\u003c/h2>\u003cdiv class=\"tabs\">\u003cbutton class=\"on\" data-evidence=\"supported\">有支持完成\u003c/button>\u003cbutton data-evidence=\"independent\">独立完成\u003c/button>\u003cbutton data-evidence=\"unknown\">尚未测量\u003c/button>\u003c/div>\u003cdiv id=\"evidence-detail\">\u003ch3>看了稿，分清保留与推迟\u003c/h3>\u003cp>说明能在文字支持下理解关系。需要新无稿音频观察是否能实时听懂。\u003c/p>\u003c/div>\u003cdiv class=\"proof-item\">\u003cb>作品与条件\u003c/b>\u003cp>排练记录的决定复述 · 第二次尝试 · 提示一次 · 看过原文\u003c/p>\u003c/div>\u003cdiv class=\"proof-item\">\u003cb>下一次怎样确认\u003c/b>\u003cp>换一个声音和情境，不给稿，再接一个追问。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"section three\">\u003cdiv>\u003cdiv class=\"kicker\">01 / 定位\u003c/div>\u003ch3>先形成教学假设\u003c/h3>\u003cp class=\"muted\">几道题选起点，不给你贴一个终身等级。\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">02 / 观察\u003c/div>\u003ch3>作品累积真实证据\u003c/h3>\u003cp class=\"muted\">独立完成、支持条件、换场景后的表现。\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">03 / 调节\u003c/div>\u003ch3>课程随证据变化\u003c/h3>\u003cp class=\"muted\">撤掉支持、增加复杂度，或补足具体缺口。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">知道原因后，继续练 →\u003c/button>\u003c/div>\u003cdiv class=\"footer\">一次错题不确定根因。转写、关键词命中和跟读次数不代表口语流利度或真实理解。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"growth\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">成长档案 / 记住真正跨过的地方\u003c/div>\u003ch1>进步是这句话，\u003cbr>现在你能说清楚了。\u003c/h1>\u003cp>比较作品和完成条件，比比较刷题数量更有意义。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"work\">\u003cdiv class=\"kicker\">原来的回应 / 需要提示\u003c/div>\u003cblockquote>“It didn't work.\u003cbr>We stopped it.”\u003c/blockquote>\u003cp>说了结果，却没有说清对象、原因和条件，把暂时推迟说成停止。\u003c/p>\u003c/div>\u003cdiv class=\"work new\">\u003cdiv class=\"kicker\">新的回应 / 同一类表达\u003c/div>\u003cblockquote>“We kept gesture control, but delayed voice control until we could test it in the exhibition hall.”\u003c/blockquote>\u003cp>决定、对象和时间边界都表达出来了。下一步在新情境独立回应，确认能迁移。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"section\">\u003ch2>这次之后，课程怎样变化？\u003c/h2>\u003cdiv class=\"three\" style=\"margin-top:24px\">\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">保留\u003c/div>\u003ch3>继续练声音里的条件\u003c/h3>\u003cp>关系能看明白，还要听得及时。换讲者，不刷旧文。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">减少\u003c/div>\u003ch3>撤掉不再需要的提示\u003c/h3>\u003cp>新材料先无稿试；卡住再给分段和关键词帮助。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">增加\u003c/div>\u003ch3>加入自己的项目回应\u003c/h3>\u003cp>用同一关系回答新问题，观点不同也可以。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"map\">看看更新后的下一站 →\u003c/button>\u003cbutton class=\"secondary\" data-go=\"evidence\">变化有哪些证据？\u003c/button>\u003c/div>\u003cdiv class=\"footer\">需要提示的进步值得保留。更强的能力结论等待独立迁移和后续观察。\u003c/div>\u003c/section>\n\n\u003c/main>\u003cscript>function go(n){document.querySelectorAll('.screen').forEach(x=>x.hidden=x.dataset.screen!==n);document.querySelectorAll('nav [data-go]').forEach(x=>x.classList.toggle('on',x.dataset.go===n));scrollTo(0,0);if(n==='lesson')step(0)}function step(n){document.querySelectorAll('.stage').forEach(x=>x.hidden=+x.dataset.stage!==+n);document.querySelectorAll('.stage-buttons button').forEach(x=>x.classList.toggle('on',+x.dataset.step===+n))}document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-step],[data-action],[data-node],[data-evidence]');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.step!==undefined)step(b.dataset.step);if(b.dataset.action==='why'){const d=b.nextElementSibling;d.hidden=!d.hidden;b.textContent=d.hidden?'为什么给我这项训练？ ↗':'收起训练依据 ↑'}if(b.dataset.action==='check'){const out=document.querySelector('#choice-feedback'),v=document.querySelector('input[name=decision]:checked');out.hidden=false;out.textContent=!v?'先选一个决定。可以回到原文看 kept 和 delayed。':v.value==='1'?'判断与原文一致：留下手势控制，语音推迟到能够测试时，不是永久取消。':'这里把暂时推迟当成永久取消。原文是 delayed…until…，先看条件，再试一次。';if(v&&v.value==='1'){const next=document.createElement('button');next.className='link';next.dataset.step='1';next.textContent='揭晓原理，进入下一步 →';out.append(document.createElement('br'),next)}}if(b.dataset.action==='hint'){const out=document.querySelector('#choice-feedback');out.hidden=false;out.textContent='分别圈出 kept 和 delayed 后面的对象，再找 until 后面的条件。先不判断方案好坏。'}if(b.dataset.action==='reference')document.querySelector('#expression-reference').hidden=false;if(b.dataset.node){document.querySelector('#node-title').textContent=b.dataset.node;document.querySelector('#node-detail').textContent=b.dataset.description}if(b.dataset.evidence){document.querySelectorAll('[data-evidence]').forEach(x=>x.classList.toggle('on',x===b));const values={supported:['看了稿，分清保留与推迟','说明能在文字支持下理解关系，需要新无稿音频观察是否能实时听懂。'],independent:['换了材料，仍能找到主线','独立完成新阅读关系任务，支持这个复杂度范围的判断，不能直接推出独立听懂或自由口述。'],unknown:['更长的课堂回应，还没有足够作品','这不是 0 分，也不是落后。下一次用新任务观察，不凭词汇量或一次短答猜测。']};const d=values[b.dataset.evidence],h=document.createElement('h3'),p=document.createElement('p');h.textContent=d[0];p.textContent=d[1];document.querySelector('#evidence-detail').replaceChildren(h,p)}});\n\u003c/script>\u003c/body>\u003c/html>", "sourceLabel": "studio.html", "baseline": false, "interactive": true}, {"id": "quest", "name": "成长关卡", "concept": "每次挑战跨过一个真实表达障碍，路线和新情境作品组成有依据的过关感。", "typography": "Trebuchet MS / 等线；粗标题与大节点数字。48px挑战标题，17px正文。", "palette": ["#2456DC", "#EEF2FA", "#FFCBAF"], "traits": ["阶段轨迹与蓝色通栏挑战", "四步横向行动条", "过关看作品和迁移，不看题量积分"], "kind": "html", "content": "\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>成长关卡 · Sentence Forge\u003c/title>\u003cstyle>*{box-sizing:border-box}body{margin:0;font:16px/1.65 var(--body);background:var(--bg);color:var(--ink)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--title)}h1{font-size:52px;line-height:1.18}h2{font-size:28px;line-height:1.4}h3{font-size:18px}p{line-height:1.8}button,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;border-bottom:1px solid var(--line);gap:20px}header>a{text-decoration:none;font-family:var(--title);font-size:23px;font-weight:bold}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{color:var(--muted);background:none;padding:9px 15px;border-radius:30px;font-size:14px}nav button.on{color:var(--bg);background:var(--ink)}main{max-width:1360px;margin:auto;padding:0 48px}.screen[hidden],.stage[hidden],.feedback[hidden]{display:none!important}.kicker{font:12px/1.6 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.tag{border:1px solid var(--line);padding:5px 9px;font-size:12px;display:inline-block}.primary,.secondary{padding:14px :22px}.english{font-size:24px}.aside{border-top:1px solid var(--line);padding-top:20px}.section{padding:28px 0}.panel{padding:22px}.primary,.secondary{padding:13px 17px}.stage-buttons button{padding:8px 10px;font-size:13px}h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}\n:root{--bg:#eef2fa;--surface:#ffffff;--ink:#182d52;--muted:#61718c;--line:#c8d2e4;--accent:#2456dc;--buttonInk:#ffffff;--highlight:#e0e8ff;--body:'DengXian',sans-serif;--title:'Trebuchet MS','DengXian',sans-serif;--english:'Trebuchet MS',sans-serif;--number:'Trebuchet MS',sans-serif}header{border-bottom:2px solid var(--ink);background:white}header>a{font-weight:900;letter-spacing:-1px}header>a em{font-style:normal;color:var(--accent)}.home{padding-top:30px}.destination{display:flex;justify-content:space-between;font-size:14px;gap:20px}.track{display:grid;grid-template-columns:repeat(6,1fr);margin:24px 0 30px}.track>div{border-top:3px solid var(--line);padding:14px 7px 8px 0;font-size:13px;color:var(--muted)}.track b{display:block;font:25px var(--title);margin-bottom:6px}.track .active{color:var(--accent);border-color:var(--accent)}.challenge{background:var(--accent);color:white;padding:34px 40px;display:grid;grid-template-columns:1fr 150px;gap:20px}.challenge .kicker{color:#c8d9ff}.challenge h1{font-size:48px;margin:14px 0 20px}.challenge p{font-size:16px;color:#e1e9ff;max-width:670px}.challenge .primary{background:#ffcbaf;color:var(--ink);font-weight:bold}.challenge .secondary{border-color:#86a6ff;color:white}.challenge .link{color:white}.stamp{border:1px solid #91aeff;align-self:start;padding:20px;font:14px/1.8 var(--title)}.stamp strong{display:block;font-size:65px;line-height:1.1;margin-bottom:13px}.steps{display:grid;grid-template-columns:repeat(4,1fr);background:white;border:1px solid var(--line)}.steps>div{padding:21px;border-right:1px solid var(--line);font-size:14px}.steps>div:last-child{border-right:0}.steps b{display:block;font-size:16px;margin-bottom:7px}.steps small{color:var(--muted)}.proofs{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:32px}.proofs>div{border-top:2px solid var(--ink);padding:22px 0}.proofs h3{font-size:22px;margin:12px 0}.proofs p{font-size:15px;color:var(--muted)}.proofs .tag{background:#ffdfcc;color:#7b3416;border:0}.node{border-top:4px solid var(--accent)}.stage-buttons button.on{background:var(--accent);color:white}@media(max-width:700px){.track{grid-template-columns:repeat(3,1fr);gap:13px 0}.track b{font-size:21px}.challenge{padding:26px 22px;grid-template-columns:1fr}.challenge h1{font-size:35px}.stamp{display:none}.steps{grid-template-columns:repeat(2,1fr)}.steps>div{padding:15px}.proofs{grid-template-columns:1fr;gap:14px}.destination{align-items:start;font-size:12px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"#today\">FORGE\u003cem> →\u003c/em>\u003c/a>\u003cnav aria-label=\"学习导航\">\u003cbutton class=\"on\" data-go=\"today\">今天\u003c/button>\u003cbutton data-go=\"map\">学习地图\u003c/button>\u003cbutton data-go=\"evidence\">我的能力\u003c/button>\u003cbutton data-go=\"growth\">成长作品\u003c/button>\u003c/nav>\u003cspan class=\"muted\" style=\"font-size:12px\">成长关卡\u003c/span>\u003c/header>\u003cmain>\u003csection class=\"screen home\" data-screen=\"today\">\u003cdiv class=\"destination\">\u003cspan>\u003cb>你的目的地\u003c/b> / 在课堂里听懂、解释、回应\u003c/span>\u003cspan class=\"tag\">已会跳过 · 不靠刷题升级\u003c/span>\u003c/div>\u003cdiv class=\"track\">\u003cdiv>\u003cb>01 ✓\u003c/b>句子主线\u003c/div>\u003cdiv>\u003cb>02 ✓\u003c/b>信息连接\u003c/div>\u003cdiv class=\"active\">\u003cb>03 →\u003c/b>复杂表达\u003c/div>\u003cdiv>\u003cb>04\u003c/b>自己的话\u003c/div>\u003cdiv>\u003cb>05\u003c/b>真实讨论\u003c/div>\u003cdiv>\u003cb>06\u003c/b>专业语境\u003c/div>\u003c/div>\u003cdiv class=\"challenge\">\u003cdiv>\u003cdiv class=\"kicker\">Today's challenge / 结构 03 · 限制与让步\u003c/div>\u003ch1>好用，为什么\u003cbr>还要推迟？\u003c/h1>\u003cp>读懂一个决定的条件，解释它，再放进自己的项目。过关意味着你能解决这类交流任务。\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">开始这次挑战 ↗\u003c/button>\u003cbutton class=\"secondary\" data-go=\"map\">我在地图的哪个位置？\u003c/button>\u003c/div>\u003cbutton class=\"link\" data-action=\"why\">为什么给我这项训练？ ↗\u003c/button>\u003cp class=\"why-detail\" hidden>已有短句与词汇基础，接下来需要区分“某个场景失灵”和“方案完全无效”。独立迁移后就往前走，不重复同一套题。\u003c/p>\u003c/div>\u003cdiv class=\"stamp\">\u003cstrong>03\u003c/strong>关系理解\u003cbr>↓\u003cbr>实际回应\u003cbr>\u003cspan style=\"color:#b6ceff\">25 MIN\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"steps\">\u003cdiv>\u003cb>读懂\u003c/b>\u003csmall>抓对象、决定和条件\u003c/small>\u003c/div>\u003cdiv>\u003cb>明白\u003c/b>\u003csmall>提示后讲清为什么\u003c/small>\u003c/div>\u003cdiv>\u003cb>表达\u003c/b>\u003csmall>用自己的话回应\u003c/small>\u003c/div>\u003cdiv>\u003cb>迁移\u003c/b>\u003csmall>换情境仍能做出来\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"proofs\">\u003cdiv>\u003cspan class=\"tag\">成长，有作品可看\u003c/span>\u003ch3>从“停了”，到“说清条件”。\u003c/h3>\u003cp>保留初答与改答。关系说清了，再用新任务确认；完成数量不变成能力分数。\u003c/p>\u003cbutton class=\"link\" data-go=\"growth\">看见我跨过了什么 →\u003c/button>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">系统怎么知道我能做什么？\u003c/div>\u003ch3>同一目标，用不同条件观察。\u003c/h3>\u003cp>有提示、独立完成、迁移成功和未测量分别标记。听说读写也分别看。\u003c/p>\u003cbutton class=\"link\" data-go=\"evidence\">展开能力依据 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"footer\">一次失败不会退回起点。系统补具体缺口，撤掉不需要的支持，沿完整地图安排后继挑战。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"map\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">你的学习坐标 / 目标：听懂课堂，参与讨论\u003c/div>\u003ch1>知道自己在哪里，\u003cbr>也知道接下来去哪。\u003c/h1>\u003cp>六段成长旅程连接结构、声音和表达。你可以跳过已会的内容，也会回到需要补足的地方。\u003c/p>\u003c/div>\u003cdiv class=\"route\">\u003cdiv class=\"stop \">\u003cspan>01 / 已跨过\u003c/span>\u003cb>找到句子主线\u003c/b>\u003csmall>谁做什么 · 句子骨架\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>02 / 已跨过\u003c/span>\u003cb>把信息接起来\u003c/b>\u003csmall>修饰与限定 · 关系范围\u003c/small>\u003c/div>\u003cdiv class=\"stop current\">\u003cspan>03 / 你在这里\u003c/span>\u003cb>跟上复杂表达\u003c/b>\u003csmall>嵌套与逻辑 · 声音切块\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>04 / 下一段\u003c/span>\u003cb>组织自己的话\u003c/b>\u003csmall>复述 · 理由 · 澄清\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>05 / 将会抵达\u003c/span>\u003cb>参与真实讨论\u003c/b>\u003csmall>课堂互动 · 观点回应\u003c/small>\u003c/div>\u003cdiv class=\"stop \">\u003cspan>06 / 持续生长\u003c/span>\u003cb>处理专业语境\u003c/b>\u003csmall>艺术科技 · 学术论证\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"section\">\u003cdiv class=\"flex\">\u003ch2>03 / 跟上复杂表达\u003c/h2>\u003cspan class=\"tag\">当前重心：逻辑关系与实时理解\u003c/span>\u003c/div>\u003cdiv class=\"node-grid\">\u003cbutton class=\"node\" data-node=\"修饰范围\" data-description=\"先找主句，再确定每个修饰挂在哪个对象上；从一个关系句到多层嵌套。熟悉的短句可以挑战后跳过。\">\u003cdiv class=\"kicker\">结构支线 / 已有基础\u003c/div>\u003cb>谁在修饰谁\u003c/b>\u003csmall>限定与补充 → 多层嵌套\u003cbr>用新材料检验，不重刷熟题\u003c/small>\u003c/button>\u003cbutton class=\"node\" data-node=\"限制与让步\" data-description=\"今日先把决定、原因和条件分开，再迁移到自己的项目回应。无稿听力和开放输出分别观察，不相互冒充。\">\u003cdiv class=\"kicker\">当前节点 / 今日训练\u003c/div>\u003cb>好用，为什么还要推迟\u003c/b>\u003csmall>关系理解 → 声音切块 → 自己表达\u003cbr>今天从可见材料开始\u003c/small>\u003c/button>\u003cbutton class=\"node\" data-node=\"持续跟上课堂\" data-description=\"短讲里抓住主线；听漏时记录缺口并继续跟上。再练请求澄清、确认理解和回答老师的追问。\">\u003cdiv class=\"kicker\">后继任务 / 随表现调整\u003c/div>\u003cb>听漏一句，也能继续\u003c/b>\u003csmall>课堂短讲 → 澄清 → 即时回应\u003cbr>支持会逐步撤掉\u003c/small>\u003c/button>\u003c/div>\u003cdiv class=\"panel\">\u003ch3 id=\"node-title\">当前位置是一个能力节点，不是一道题\u003c/h3>\u003cp id=\"node-detail\">同一节点可以用不同材料、难度和技能练习。你学会的是理解与表达关系的方法；下一节不必重复同一句话。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"three\">\u003cdiv class=\"panel\">\u003ch3>先定位，再选起点\u003c/h3>\u003cp>挑战逐渐变难，卡住后再区分：词音不熟、关系没抓到，还是表达调不出来。未测到的能力保留未知。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>主线稳定，课程会生长\u003c/h3>\u003cp>完整知识地图是底座。近期课程按需生成并审核，根据作品调整材料、支持与复杂度。\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch3>熟悉内容可以跳过\u003c/h3>\u003cp>不用重头刷。独立挑战可支持跳过；申请免修只改变安排，不自动证明掌握。\u003c/p>\u003c/div>\u003c/div>\u003cdetails class=\"panel\" style=\"margin-top:25px\">\u003csummary style=\"cursor:pointer;font-weight:bold\">六段路线下面，到底覆盖哪些知识？\u003c/summary>\u003cp>路线是易读的导航；完整知识面藏在下面，不把英语缩成六个小章节。\u003c/p>\u003cdiv class=\"three\" style=\"margin-top:20px\">\u003cdiv>\u003ch3>句子怎样搭起来\u003c/h3>\u003cp>主线与句型 · 动词与论元 · 名词短语 · 限定与指代 · 修饰范围 · 关系句与嵌套\u003c/p>\u003c/div>\u003cdiv>\u003ch3>意义怎样精确表达\u003c/h3>\u003cp>时态与体 · 情态 · 被动 · 否定与疑问 · 比较 · 条件与假设 · 非限定形式 · 省略与强调\u003c/p>\u003c/div>\u003cdiv>\u003ch3>信息怎样成为交流\u003c/h3>\u003cp>衔接与信息焦点 · 语用与语域 · 词汇搭配与语块 · 连读弱读与韵律 · 澄清与互动 · 学术论证与回应\u003c/p>\u003c/div>\u003c/div>\u003cp>同一结构沿复杂度深入，同时在听、说、读、写中迁移。底层知识地图组织完整范围；个人路径只挑现在需要的节点。\u003c/p>\u003c/details>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">从当前节点开始 →\u003c/button>\u003cbutton class=\"secondary\" data-go=\"evidence\">展开听说读写的证据\u003c/button>\u003c/div>\u003cdiv class=\"footer\">路线连接句子结构、时体与语气、信息组织、词汇语块、声音理解、互动表达与学术应用。阶段位置表示任务方向，不是整体英语能力百分比。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"lesson\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">今日任务 / 关系理解 → 自己表达\u003c/div>\u003ch1>好用，为什么还要推迟？\u003c/h1>\u003cp>分清一个方案有效的条件，再说清自己会怎样决定。约 25 分钟。\u003c/p>\u003c/div>\u003cdiv class=\"stage-buttons\">\u003cbutton class=\"on\" data-step=\"0\">01 读懂\u003c/button>\u003cbutton data-step=\"1\">02 讲清原理\u003c/button>\u003cbutton data-step=\"2\">03 自己说\u003c/button>\u003cbutton data-step=\"3\">04 换情境\u003c/button>\u003c/div>\u003cdiv class=\"lesson-grid\">\u003cdiv class=\"lesson\">\u003cdiv class=\"stage\" data-stage=\"0\">\u003cdiv class=\"kicker\">排练室里的决定\u003c/div>\u003cp class=\"english\">\u003cmark>Although\u003c/mark> our voice prototype worked well in a quiet studio, it failed during a crowded exhibition. We kept the gesture controls, \u003cmark>but\u003c/mark> we delayed voice control until we could test it with visitors in the exhibition hall.\u003c/p>\u003ch3>团队作出的决定是什么？\u003c/h3>\u003cdiv class=\"options\">\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"0\">语音没有用，所以以后永远不用。\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"1\">保留手势控制，语音控制推迟到能在展厅测试时。\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-action=\"check\">查看判断依据 ↗\u003c/button>\u003cbutton class=\"secondary\" data-action=\"hint\">给我一个提示\u003c/button>\u003c/div>\u003cdiv id=\"choice-feedback\" class=\"feedback\" hidden>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"1\" hidden>\u003cdiv class=\"kicker\">把新情况归到原来的原理里\u003c/div>\u003ch2>先找主线，再看\u003cbr>它在哪种条件下成立。\u003c/h2>\u003cp>“在安静工作室有效”和“在人多的展厅失灵”可以同时成立。\u003cb>although\u003c/b> 承认前一个事实，同时引出后一个事实，没有把方案直接否定。\u003c/p>\u003cp>最后的决定是 kept 与 delayed。\u003cb>until we could test…\u003c/b> 指明推迟的时间边界。原文没有保证测试之后一定采用，也没有说永久取消。\u003c/p>\u003cdiv class=\"feedback\">判断靠对象、场景、决定和条件的真实关系。but 后面并不总是限制。\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-step=\"2\">换成自己的话 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"2\" hidden>\u003cdiv class=\"kicker\">输出 / 课堂里能用得上\u003c/div>\u003ch2>用 2–3 句英语\u003cbr>讲清这次决定。\u003c/h2>\u003cp>设想同学问：“Why did you delay voice control?” 说清原因与条件。再把同样的表达用在自己的一个项目上。\u003c/p>\u003ctextarea aria-label=\"你的英语回应\" placeholder=\"We kept… but we delayed… because…\">\u003c/textarea>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-action=\"reference\">对照参考表达与依据 ↗\u003c/button>\u003c/div>\u003cdiv id=\"expression-reference\" class=\"feedback\" hidden>\u003cb>一种自然表达\u003c/b>\u003cp>We kept gesture control, but postponed voice control because it failed in the crowded exhibition. We need to test it with visitors before taking the next step.\u003c/p>\u003cp>对照你的作品：保留与推迟的对象是否说对？有没有把暂时推迟说成永久取消？理解你的表达要看意思和关系，词表只能提供线索。\u003c/p>\u003cbutton class=\"link\" data-step=\"3\">继续做无法照抄的新任务 →\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stage\" data-stage=\"3\" hidden>\u003cdiv class=\"kicker\">迁移 / 不靠记住原句\u003c/div>\u003ch2>换了场景，\u003cbr>你还能用出来吗？\u003c/h2>\u003cp>你的互动展览在小房间运行流畅，但大厅里会延迟。老师问：“Should we cancel the installation?”\u003c/p>\u003cdiv class=\"panel\" style=\"margin-top:22px\">\u003ch3>回应这个问题\u003c/h3>\u003cp>说明你会保留什么，再说明什么需要调整或测试。方案可以不同，只要理由与条件清楚。\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"growth\">这种任务怎样记录成长？ ↗\u003c/button>\u003cbutton class=\"secondary\" data-go=\"map\">它在路线的什么位置？\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003caside class=\"aside\">\u003cspan class=\"tag\">结构 03 · 限制与让步\u003c/span>\u003ch3>为什么现在练它？\u003c/h3>\u003cp>词汇与短句已有基础，但长句里“结论在哪里、条件是什么”还会慢一步。先把关系读清，再用无稿听力验证声音里的同一关系。\u003c/p>\u003ch3>这次观察什么\u003c/h3>\u003cp>理解关系，不是背定义。看提示后的完成是补练；独立完成新情境，才是更强的证据。\u003c/p>\u003cbutton class=\"link\" data-go=\"evidence\">系统怎样判断我的能力？\u003c/button>\u003c/aside>\u003c/div>\u003cdiv class=\"footer\">失败可以提示、重试、查词或提出表达争议。一次错题不会直接把你归为“不懂这项”。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"evidence\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">能力画像 / 判断有依据，也有边界\u003c/div>\u003ch1>不是做对几题，\u003cbr>就说你已经会了。\u003c/h1>\u003cp>听、说、读、写分别看；任务难度、支持条件和新情境表现共同构成判断依据。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv>\u003cdiv class=\"skill\">\u003cstrong>听\u003c/strong>\u003cdiv>\u003cb>有稿能理解，无稿会卡在关系词\u003c/b>\u003cp>换声音、无字幕再检验，不把看稿成功记为独立听懂。\u003c/p>\u003csmall>正在练 · 需要支持\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>说\u003c/strong>\u003cdiv>\u003cb>能用短句回答，长回应需要准备\u003c/b>\u003cp>用自己的项目说明决定，再接一个不知道的问题。\u003c/p>\u003csmall>初步观察 · 待迁移\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>读\u003c/strong>\u003cdiv>\u003cb>能抓主线，复杂修饰仍需核对范围\u003c/b>\u003cp>在不同材料找到主句；更深的嵌套等待新任务证据。\u003c/p>\u003csmall>已独立完成 · 部分范围\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"skill\">\u003cstrong>写\u003c/strong>\u003cdiv>\u003cb>能表达决定，条件与让步还需练习\u003c/b>\u003cp>作品足以安排补练，不足以判断更长学术写作。\u003c/p>\u003csmall>已有作品 · 尚未全面测量\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003cdiv class=\"kicker\">展开一项判断\u003c/div>\u003ch2 style=\"margin-top:14px\">“逻辑关系”\u003cbr>到底会到什么程度？\u003c/h2>\u003cdiv class=\"tabs\">\u003cbutton class=\"on\" data-evidence=\"supported\">有支持完成\u003c/button>\u003cbutton data-evidence=\"independent\">独立完成\u003c/button>\u003cbutton data-evidence=\"unknown\">尚未测量\u003c/button>\u003c/div>\u003cdiv id=\"evidence-detail\">\u003ch3>看了稿，分清保留与推迟\u003c/h3>\u003cp>说明能在文字支持下理解关系。需要新无稿音频观察是否能实时听懂。\u003c/p>\u003c/div>\u003cdiv class=\"proof-item\">\u003cb>作品与条件\u003c/b>\u003cp>排练记录的决定复述 · 第二次尝试 · 提示一次 · 看过原文\u003c/p>\u003c/div>\u003cdiv class=\"proof-item\">\u003cb>下一次怎样确认\u003c/b>\u003cp>换一个声音和情境，不给稿，再接一个追问。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"section three\">\u003cdiv>\u003cdiv class=\"kicker\">01 / 定位\u003c/div>\u003ch3>先形成教学假设\u003c/h3>\u003cp class=\"muted\">几道题选起点，不给你贴一个终身等级。\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">02 / 观察\u003c/div>\u003ch3>作品累积真实证据\u003c/h3>\u003cp class=\"muted\">独立完成、支持条件、换场景后的表现。\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"kicker\">03 / 调节\u003c/div>\u003ch3>课程随证据变化\u003c/h3>\u003cp class=\"muted\">撤掉支持、增加复杂度，或补足具体缺口。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" data-go=\"lesson\">知道原因后，继续练 →\u003c/button>\u003c/div>\u003cdiv class=\"footer\">一次错题不确定根因。转写、关键词命中和跟读次数不代表口语流利度或真实理解。\u003c/div>\u003c/section>\n\u003csection class=\"screen\" data-screen=\"growth\" hidden>\u003cdiv class=\"page-head\">\u003cdiv class=\"kicker\">成长档案 / 记住真正跨过的地方\u003c/div>\u003ch1>进步是这句话，\u003cbr>现在你能说清楚了。\u003c/h1>\u003cp>比较作品和完成条件，比比较刷题数量更有意义。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv class=\"work\">\u003cdiv class=\"kicker\">原来的回应 / 需要提示\u003c/div>\u003cblockquote>“It didn't work.\u003cbr>We stopped it.”\u003c/blockquote>\u003cp>说了结果，却没有说清对象、原因和条件，把暂时推迟说成停止。\u003c/p>\u003c/div>\u003cdiv class=\"work new\">\u003cdiv class=\"kicker\">新的回应 /   syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  $('#notes-toggle').checked=st.notesOn;
  $('#filter-summary').textContent=`比较范围 ${list.length}/${C.length}`;
  $$('#filter-list input').forEach(i=>i.checked=st.visible.includes(i.value));
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”会带上最新备注重新复制，不再有单独的复制按钮
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
   animate($('#decide-name'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:ease('glide')});
   animate($('#choice-chip'),[{transform:'scale(.3)'},{transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?'已选择':'已选择 · 复制'):(short?'选择':'选这个方向')));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?'再点一次，带上最新备注重新复制':'选择这个方向，并复制给 Agent';});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
  const c=byId[st.chosen];$('#decide-name').textContent=c?`${no(c)} ${c.name}`:'未选择方向';$('#picked').classList.toggle('on',!!c);
  const chip=$('#choice-chip'),next=c?stripMini(c):el('span','choice-empty');next.id='choice-chip';chip.replaceWith(next);
  status();
 }
 function status(){$('#notes-open').textContent=st.notes?'备注 ·':'备注';const s=$('#state');if(!stored){s.textContent='浏览器存储不可用：关闭页面后选择和备注不会保留。';s.dataset.warn='';}else{s.textContent='备注会和选择一起复制。改完备注，再点一次“已选择”重新复制。';delete s.dataset.warn;}}
 function copyText(){const c=byId[st.chosen];let t=`${DATA.round?DATA.round+'：':''}选 ${no(c)} ${c.name}`;if(st.notes.trim())t+=`\n备注：${st.notes.trim()}`;return t;}
 async function copy(){
  const t=copyText();let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,t){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?'已复制，粘贴给 Agent':'复制失败，请手动复制';n.querySelector('code').textContent=ok?t.replace(/\n/g,' · '):t;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 const fl=$('#filter-list');
 C.forEach(c=>{const l=el('label'),i=el('input');i.type='checkbox';i.value=c.id;i.addEventListener('change',()=>{st.visible=C.map(x=>x.id).filter(id=>id===c.id?i.checked:st.visible.includes(id));save();morph(render,'reshape');});l.append(i,el('span','n',no(c)),c.name);fl.append(l);});
 $('#show-all').addEventListener('click',()=>{st.visible=C.map(c=>c.id);save();morph(render,'reshape');});
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#notes-toggle').addEventListener('change',e=>{st.notesOn=e.target.checked;save();morph(render,'reshape');});
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 const notes=$('#notes');notes.value=st.notes||'';
 notes.addEventListener('input',()=>{st.notes=notes.value;save();status();});
 $('#notes-open').parentElement.addEventListener('toggle',e=>{if(e.target.open)notes.focus();});
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
})();
</script></body></html>
