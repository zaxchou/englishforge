# EnglishForge 生产 Compose 模板（实际部署目录：deploy/production/ —— 已 gitignore，密钥只在那里）。
# 单实例常驻；数据在 JunEnglish/data/englishforge-production/，与镜像版本无关。
# 改动本文件后必须同步 deploy/production/compose.yaml —— 部署用的是后者。
# name 必须独立：NAS 上 MyInfobase 的 compose 项目也叫 production，同名会互相把对方当
# "孤儿容器"，谁要是顺手 --remove-orphans 就会把另一家的服务杀掉。
name: englishforge
services:
  englishforge:
    image: englishforge:${ENGLISHFORGE_TAG:-latest}
    container_name: englishforge
    restart: unless-stopped
    # 以共享目录属主身份运行，避免 root 写数据（zaxchou uid=1026, users gid=100，已在 NAS 核实）
    user: "${CONTAINER_UID:-1026}:${CONTAINER_GID:-100}"
    ports:
      - "${ENGLISHFORGE_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器内数据库路径（挂载卷内，随容器生命周期无关、可备份）
      ENGLISHFORGE_DB: /app/data/englishforge.db
      # 模型密钥走环境白名单进容器（运行时读，不进 git、不落镜像）。
      # 出题 = DeepSeek；审核/改稿另一角色 = MiMo（AI_* 通用槽位，与 molin-wiki 同源）。
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.xiaomimimo.com/v1}"
      AI_MODEL: "${AI_MODEL:-mimo-v2.6-flash}"
    volumes:
      # 生产数据库目录（NAS 本机真实路径，写在 .env）：与本地开发库相互独立
      - ${DATA_DIR}/englishforge-production:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/api/health >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 8s
      start_period: 90s
      retries: 3
