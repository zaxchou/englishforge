const defs={listening:{name:'听力',title:'听懂计划变化与说话意图',goal:'跟上人物此刻要做什么，发现时间纠正与误会。',modules:['导学与首听','声音识别与语块','一句回应','对话与意图','公告与行动','学术谈话','限时综合'],summary:'先完整听，保住情境和人物关系。做完题后再回放卡住的话轮，区分声音没识别和意思没接上；不用先把全文听写出来。',source:'郭小钰精讲＋听口基础讲义方法归纳；本章视频为学科导学。',prefix:'04 新托福'},reading:{name:'阅读',title:'从邮件中定位日期与行动',goal:'分清预约日期、活动日期和需要自带的物品。',modules:['导学与线索','补全单词','日常文本','长句理解','词义与推断','修辞与篇章','限时综合'],summary:'先确定题目问的是哪个事件，再回原文找对应的时间和动作。找到同一个词不等于找到答案；比较已提供的东西和要求自带的东西。',source:'刘倩俐阅读讲义定位与语境方法；本章视频为学科导学。',prefix:'05 新托福'},writing:{name:'写作',title:'把问题说明白，把请求写清楚',goal:'完成投稿故障邮件，让读者知道发生什么、怎样帮你。',modules:['导学与表达','原词块组句','邮件任务','学术讨论','论证方法','修改与限时'],summary:'先明确收件人、目的与题目要求。形成自己的第一稿，再检查问题和请求是否清楚。修改优先解决影响读者行动的一点，而不是整篇换成高级词。',source:'徐欣写作讲义的邮件目的、请求和语域方法；本章视频为学科导学。',prefix:'06 新托福'},speaking:{name:'口语',title:'听懂采访问题，展开自己的回应',goal:'先直接回答，再用一个具体理由或细节支撑。',modules:['导学','发音与意群','听后重复','采访直答','理由与例子','无稿限时'],summary:'采访回答先回应问题，再给与自己有关的细节；不背万能长模板。听后重复另练原句保持与可懂度，不能把同义改写算准确重复。',source:'张莹炜口语讲义直接回应、意群及具体细节方法；本章视频为学科导学。',prefix:'07 新托福'}};
const questions={reading:[{id:'r11',q:'11. When is the date of the art workshop?',opts:['September 10th','September 12th','September 20th','September 30th'],key:2,quote:'The workshop will take place on September 20th at 3:00 PM.',why:'9月10日是预约日期；题目问活动日期，will take place 指向9月20日。',tag:'事件与时间定位'}, {id:'r12',q:'12. What should Ms. Edwards bring to the workshop?',opts:['A payment method','Extra paint','A protective garment','Proof of reservation'],key:2,quote:'All necessary art supplies will be provided, but please bring your own apron or smock.',why:'用品已提供，要求自带的是 apron 或 smock，属于防护衣物。',tag:'语境与行动要求'}],listening:[{id:'l9',q:'9. What does the woman imply that she was about to do?',opts:['See a play','Change her clothes','Go shopping','Eat dinner'],key:2,quote:'Need anything from the supermarket?',why:'女人询问超市需要买什么，暗示自己原本准备去购物。',tag:'话轮意图'},{id:'l10',q:'10. Why does the man say “I’d forget my head if it wasn’t screwed on”?',opts:['He forgot what the woman wanted him to buy.','He forgot about the timing of their plans.','He forgot that they were going to eat for dinner.','He forgot to buy salmon and salad at the supermarket.'],key:1,quote:'Woman: That’s tomorrow.',why:'女人纠正看戏是明天，男人随后自嘲健忘；这里对应忘记计划时间。',tag:'事件与时间定位'}]};

function render(){if(state.view==='course')state.resume[state.part]=state.tab;if(recording){recorder.stop();recording=false}speechSynthesis?.cancel();const d=defs[state.part];document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.dataset.part===state.part&&state.view==='course'||b.dataset.view===state.view));$('#wrongCount').textContent=Object.keys(state.errors).length;$('#crumb').textContent=state.view==='course'?'四科课程 / '+d.name+' / 样板01 / '+d.title:({dashboard:'首页 / 学习总览',profile:'我的学习 / 个人档案',test:'独立真题测试',errors:'错题本',weak:'薄弱环节',resources:'资料库'}[state.view]);$('#directory').innerHTML='<div class="dirhead"><h2>'+d.name+'课程</h2><p class="muted">教学目录 · 样板章可学习</p><span class="source">全科目录仍在编排，规划章不计为已发布。</span></div>'+d.modules.map((m,i)=>'<button class="item '+(i===0?'active':'')+'" data-module="'+i+'"><b>'+String(i+1).padStart(2,'0')+'　'+m+'</b><span>'+(i===0?'样板01 · '+total()+'/3活动':'后续模块 · 规划中')+'</span></button>').join('')+'<div class="footer">老师原课程：'+CATALOG.videos.filter(v=>v.file.startsWith(d.prefix)).length+'段<br>讲义与原题按章节关联</div>';$('.app').classList.toggle('overview',state.view==='dashboard'||state.view==='profile');if(state.view==='dashboard'||state.view==='profile')$('#directory').innerHTML='';$('#body').innerHTML=state.view==='dashboard'?dashboard():state.view==='profile'?profilePage():state.view==='course'?course():state.view==='errors'?errors():state.view==='weak'?weak():state.view==='test'?test():resources();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if($('#lessonVideo')){const videoPart=state.part;let lastVideoTime=0;const v=$('#lessonVideo');const videoStatus=$('#videoStatus');v.addEventListener('loadedmetadata',()=>{if(!v.isConnected)return;v.currentTime=Math.min(state.positions[videoPart]||0,v.duration||0);lastVideoTime=v.currentTime});v.addEventListener('timeupdate',()=>{if(!v.isConnected)return;const t=v.currentTime,delta=t-lastVideoTime;state.positions[videoPart]=t;if(!v.paused&&delta>0&&delta<5){let intervals=state.coverage[videoPart]||[];intervals.push([lastVideoTime,t]);intervals.sort((a,b)=>a[0]-b[0]);let merged=[];for(const p of intervals){let prev=merged.at(-1);if(prev&&p[0]<=prev[1]+.2)prev[1]=Math.max(prev[1],p[1]);else merged.push(p.slice())}state.coverage[videoPart]=merged}lastVideoTime=t;let sec=(state.coverage[videoPart]||[]).reduce((n,a)=>n+a[1]-a[0],0);videoStatus.textContent='位置 '+Math.floor(t)+'秒 / 覆盖 '+(v.duration?Math.min(100,Math.round(sec/v.duration*100)):0)+'%（观看区间）';persist()});v.addEventListener('seeking',()=>lastVideoTime=v.currentTime);v.addEventListener('error',()=>videoStatus.textContent='播放器未能加载此文件，可读讲义继续；播放不算完成。')}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;capture();if(b.dataset.part&&b.dataset.act!=='backError'){state.part=b.dataset.part;state.view='course';state.tab=state.resume[state.part]||'learn';render();return}if(b.dataset.view){state.view=b.dataset.view;render();return}if(b.dataset.module){if(b.dataset.module==='0'){state.view='course';state.tab='learn';render()}else{$('#body').innerHTML='<div class="eyebrow">'+defs[state.part].name+' / 规划模块</div><h1>'+defs[state.part].modules[b.dataset.module]+'</h1><p>这是站点地图中的后续模块，尚未扩建教学章。不会把空目录称为已经交付的课程。</p>'+btn('回到样板章','continue','',true)}return}
const a=b.dataset.act;if(a==='profileSave'){state.profile={target:$('#targetScore').value.trim(),date:$('#examDate').value,focus:$('#personalFocus').value.trim()};persist();$('#profileStatus').textContent='已保存；返回首页可查看。'}else if(a==='menu'){$('.app').classList.toggle('showMenu');window.scrollTo(0,0)}else if(a==='directory'){$('.app').classList.toggle('showDirectory');window.scrollTo(0,0)}else if(a==='tab'){state.view='course';state.tab=b.dataset.tab;render()}else if(a==='learnDone'||a==='videoDone'){complete('learn');if(a==='videoDone'){state.support[state.part]='video_self_report';persist()}state.tab='practice';render()}else if(a==='submit'){const qs=questions[state.part];let invalid=qs?qs.some(q=>state.answers[q.id]===undefined):!state.drafts[state.part]?.trim()&&!(state.part==='speaking'&&audioData);if(invalid){$('#validation').className='error';$('#validation').textContent='请先完成本组选择，或提供文字/录音。已有输入保留。';return}if(!state.attempts[state.part])state.attempts[state.part]={answers:{...state.answers},draft:state.drafts[state.part]||'',time:Date.now()};for(const q of qs||[]){if(state.attempts[state.part].answers[q.id]!==q.key&&!state.errors[q.id])state.errors[q.id]={id:q.id,part:state.part,title:q.q,tag:q.tag,detail:'首次记录的选择：'+String.fromCharCode(65+state.attempts[state.part].answers[q.id])+'，原文支持 '+String.fromCharCode(65+q.key)}}complete('practice');state.tab='review';render()}else if(a==='selfWeak'){state.errors[state.part+'-self']??={id:state.part+'-self',part:state.part,title:defs[state.part].title,tag:'本人记录：卡住或不确定',detail:state.notes[state.part]||'需要在复盘中说明困难。'};persist();$('#validation').textContent='疑点已进入错题本。'}else if(a==='reviewDone'){if(!questions[state.part]&&!state.notes[state.part]?.trim()){$('#teacherState').textContent='请先写下自己的复盘或疑问；AI尚未分析，不直接标记已复盘。';return}complete('review');render()}else if(a==='note')$('#saveState').textContent=' 笔记已保存到本浏览器原型。';else if(a==='ask')$('#teacherState').textContent='已保存你的问题和当前作答。AI老师尚未接入，不生成预设回复。';else if(a==='errors'){state.view='errors';render()}else if(a==='backError'){state.part=b.dataset.part;state.view='course';state.tab='review';render()}else if(a==='continue'){state.view='course';render()}else if(a==='next')$('#body').innerHTML='<h1>下一步进入后续模块。</h1><p>样板当前完成 '+total()+'/3活动。后续章与未见验证题尚未发布，不会循环把同题当新进展。</p>'+btn('看课程目录','directory')+btn('返回样板','continue');else if(a==='speak'){if(!window.speechSynthesis){$('#teacherState').textContent='此浏览器不支持文字朗读。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('#feedbackText').innerText);u.lang='zh-CN';speechSynthesis.speak(u)}else if(a==='pause'){if(speechSynthesis.paused)speechSynthesis.resume();else speechSynthesis.pause()}else if(a==='stop')speechSynthesis.cancel();else if(a==='record'){if(recording){recorder.stop();recording=false;$('#recordState').textContent='录音结束，正在准备回放。';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),parts=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>parts.push(e.data);recorder.onstop=()=>{const r=new FileReader();r.onload=()=>{audioData=r.result;if($('#recordPlayback'))$('#recordPlayback').innerHTML='<audio controls src="'+audioData+'"></audio>'};r.readAsDataURL(new Blob(parts,{type:recorder.mimeType}));stream.getTracks().forEach(t=>t.stop())};recorder.start();recording=true;$('#recordState').textContent='正在录音，点击按钮停止。'}catch{$('#recordState').textContent='麦克风不可用或未授权，可导入录音；其他输入已保存。'}}});
render();
</script></body></html>
